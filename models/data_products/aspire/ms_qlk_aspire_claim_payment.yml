version: 2

models:
  - name: ms_qlk_aspire_claim_payment
    description: "Payment records for claims including amounts, methods, status, and void/reissue information"
    columns:
      - name: claim_payment_sk
        description: "Surrogate key for the payment"
        tests:
          - not_null
          - unique
      - name: claim_sk
        description: "Surrogate key for the claim"
        tests:
          - not_null
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
      - name: src_claim_id
        description: "Source system claim ID"
        tests:
          - not_null
      - name: auto_payment_ind
        description: "Indicates if payment was auto-approved"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: payee_registered_for_gst_ind
        description: "Indicates if payee is registered for GST"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: latest_weekly_benefit_ind
        description: "Indicates if this is the latest weekly benefit payment"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: migrated_pymt_ind
        description: "Indicates if payment was migrated from legacy system"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: digital_payment_ind
        description: "Indicates if payment was made digitally"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

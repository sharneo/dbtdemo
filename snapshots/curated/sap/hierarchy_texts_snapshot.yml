version: 2

snapshots:
  - name: hierarchy_texts_snapshot
    description: |
      SCD Type 2 history of SAP Hierarchy/Set Text descriptions (SETLEAF).
      Grain: one row per version of each hierarchy text entry.
      Stores language-specific descriptive text for sets and hierarchies.
    columns:
      - name: hierarchy_texts_sk
        description: Surrogate key for this hierarchy text record, generated from [setclass, subclass, setname]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: setclass
        description: Set Class (SAP SETCLASS). Categorizes the set type.

      - name: subclass
        description: Subclass of the set within the set class.

      - name: setname
        description: Set Name. Unique name identifying the hierarchy or set.

      - name: langu
        description: Language Key (SAP SPRAS). Language of the description text.

      - name: descript
        description: Description text for the hierarchy or set in the specified language.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

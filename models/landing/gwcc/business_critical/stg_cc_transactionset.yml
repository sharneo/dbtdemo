version: 2
models:
-  name: stg_cc_transactionset
   description: "Incremental staging model for Guidewire Claim Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: createuserid
      description: "User who created the object"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_transactionset_publicid_not_null
            config:
               severity: warn
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_transactionset_createtime_not_null
            config:
               severity: warn
   -  name: voidtransactionreason_icare
      description: "The Reason that a transaction has been voided."
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_transactionset_retired_not_null
            config:
               severity: warn
   -  name: documentlinkableid
      description: "This entity fk is designed to make other claim center entities linkable to documents."
   -  name: transferfromclaimnumber_icare
      description: "Transfer from Claim Number"
   -  name: recurrenceid
      description: "The recurrence schedule for the check set, if it has one."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: approvaldate
      description: "The date when the object was ultimately approved or rejected"
   -  name: adjustmentpayment_icare
      description: "Flag for adjustment payment"
   -  name: approvalstatus
      description: "The approval status of the object"
      tests:
      -  not_null:
            name: gwcc_cc_transactionset_approvalstatus_not_null
            config:
               severity: warn
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_transactionset_updatetime_not_null
            config:
               severity: warn
   -  name: manualtransactionreason_icare
      description: "The Reason that a manual payment has been created."
   -  name: claimid
      description: "The claim entity to which this TransactionSet belongs."
      tests:
      -  not_null:
            name: gwcc_cc_transactionset_claimid_not_null
            config:
               severity: warn
   -  name: requestinguserid
      description: "The user submitting the object for approval"
      tests:
      -  not_null:
            name: gwcc_cc_transactionset_requestinguserid_not_null
            config:
               severity: warn
   -  name: subtype
      description: "Identifies a particular subtype within a supertype table; each subtype of a supertype has its own unique subtype value"
      tests:
      -  not_null:
            name: gwcc_cc_transactionset_subtype_not_null
            config:
               severity: warn
   -  name: transfertoclaimnumber_icare
      description: "Transfer to Claim Number"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_transactionset_id_not_null
            config:
               severity: warn
   -  name: paymenttype_icare
      description: "The Type of Payment"
   -  name: managingentityname_icare
      description: ""
   -  name: invoicetype_ext
      description: ""
   -  name: excessrefundpayment_ext
      description: ""
   -  name: issavedcheck_ext
      description: ""
   -  name: weeklybenefitrationale_ext
      description: ""
   -  name: sportingtransactionreason_ext
      description: ""
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

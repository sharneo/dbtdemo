version: 2
models:
-  name: cc_workstatus
   columns:
   -  name: statusdate
      description: "Date when status changed to this entitys WorkCapacity."
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: createuserid
      description: "User who created the object"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_workstatus_publicid_not_null
            config:
               severity: warn
   -  name: wageloss_icare
      description: "Wage loss flag"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_workstatus_createtime_not_null
            config:
               severity: warn
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_workstatus_retired_not_null
            config:
               severity: warn
   -  name: numdaysworked
      description: "Number of days worked per week."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: employmentdataid
      description: "The related employee."
   -  name: status
      description: "Work capacity status for the employee."
   -  name: comments
      description: "Additional comments."
   -  name: lastworkeddate
      description: "The date the employee last worked. Utilized if WorkCapacity == Off-work"
   -  name: paidfullforlastworked
      description: "Indicates if the employee was paid in full for the Last day worked. Utilized if WorkCapacity == Off-work"
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_workstatus_updatetime_not_null
            config:
               severity: warn
   -  name: statusenddate
      description: "Last day at this WorkCapacity status. Null indicates current status."
   -  name: wageamountpostinjury
      description: "Amount of wages per week post-injury."
   -  name: numhoursworked
      description: "Number of hours worked per week during this period"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_workstatus_id_not_null
            config:
               severity: warn

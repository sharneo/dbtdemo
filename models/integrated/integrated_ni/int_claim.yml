version: 2
models:
-  name: int_claim
   description: "Integrated claim model sourced from Guidewire CC. Contains comprehensive claim details including dates, status, financials, employer info, and policy references. Original SAS source: 05_CLAIM.sas (TBL_NM: MSC_QLK_ASPIRE_CLAIM)"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber)"
      tests:
      -  unique:
            name: int_claim_claim_sk_unique
            config:
               severity: warn
      -  not_null:
            name: int_claim_claim_sk_not_null
            config:
               severity: warn
   -  name: source_system
      description: "Source system identifier"
   -  name: managing_entity_id
      description: "Managing entity ID from CC_CLAIM"
   -  name: managing_entity_sk
      description: "Surrogate key for managing entity"
      tests:
      -  not_null:
            name: int_claim_managing_entity_sk_not_null
            config:
               severity: warn
   -  name: managing_entity_cd
      description: "Managing entity code"
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_claim_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_claim_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: src_claim_id
      description: "Source claim ID from CC_CLAIM"
      tests:
      -  not_null:
            name: int_claim_src_claim_id_not_null
            config:
               severity: warn
   -  name: policy_nbr
      description: "Policy number associated with the claim"
   -  name: policy_verified
      description: "Policy verified indicator"
   -  name: policy_manual_verify
      description: "Policy manual verify indicator"
   -  name: legacy_policy_nbr
      description: "Legacy policy number"
   -  name: claim_assignment_dttm
      description: "Claim assignment datetime"
   -  name: claim_assignment_dt
      description: "Claim assignment date"
   -  name: src_create_dttm
      description: "Source system creation timestamp"
      tests:
      -  not_null:
            name: int_claim_src_create_dttm_not_null
            config:
               severity: warn
   -  name: src_create_dt
      description: "Source system creation date"
   -  name: claim_report_dttm
      description: "Claim reported datetime"
   -  name: claim_report_dt
      description: "Claim reported date"
   -  name: report_to_emp_dttm
      description: "Date reported to employer datetime"
   -  name: report_to_emp_dt
      description: "Date reported to employer date"
   -  name: claim_made_dttm
      description: "Claim made datetime"
   -  name: claim_made_dt
      description: "Claim made date"
   -  name: claim_close_dttm
      description: "Claim close datetime"
   -  name: claim_close_dt
      description: "Claim close date"
   -  name: claim_reopen_dttm
      description: "Claim reopen datetime"
   -  name: claim_reopen_dt
      description: "Claim reopen date"
   -  name: claim_reopen_close_dttm
      description: "Claim reopen close datetime"
   -  name: claim_reopen_close_dt
      description: "Claim reopen close date"
   -  name: loss_dttm

version: 2

snapshots:
  - name: profit_center_snapshot
    description: |
      SCD Type 2 history of SAP Profit Center master data (CEPC).
      Grain: one row per version of each profit center.
      Tracks organizational units for internal profitability reporting, with validity periods.
    columns:
      - name: profit_center_sk
        description: Surrogate key for this profit center record, generated from [prctr]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: prctr
        description: Profit Center (SAP PRCTR). Alphanumeric identifier for the profit center.

      - name: datbi
        description: Valid To Date (SAP DATBI). End date of the profit center's validity period.

      - name: kokrs
        description: Controlling Area (SAP KOKRS). Identifies the CO area this profit center belongs to.

      - name: datab
        description: Valid From Date (SAP DATAB). Start date of the profit center's validity period.

      - name: ersda
        description: Created On (SAP ERSDA). Date when the profit center was created.

      - name: usnam
        description: User Name (SAP USNAM). User who last changed the profit center master record.

      - name: verak
        description: Person Responsible (SAP VERAK). User or position responsible for the profit center.

      - name: khinr
        description: Standard Hierarchy Area (SAP KHINR). Standard hierarchy assignment for profit center reporting.

      - name: ktext
        description: Profit Center Short Text. Short description of the profit center.

      - name: ltext
        description: Profit Center Long Text. Detailed description of the profit center.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

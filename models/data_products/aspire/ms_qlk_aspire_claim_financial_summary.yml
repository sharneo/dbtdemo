version: 2

models:
  - name: ms_qlk_aspire_claim_financial_summary
    description: "Financial summary of claims including reserves, payments, and recoveries at exposure level"
    columns:
      - name: claim_sk
        description: "Surrogate key for the claim"
        tests:
          - not_null
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
      - name: src_claim_id
        description: "Source system claim ID"
        tests:
          - not_null
      - name: src_exp_id
        description: "Source exposure ID"
        tests:
          - not_null
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

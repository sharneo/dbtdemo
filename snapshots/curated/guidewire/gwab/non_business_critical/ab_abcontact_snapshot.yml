snapshots:
  - name: ab_abcontact_snapshot
    relation: ref('stg_ab_abcontact')
    config:
      schema: GWAB
      unique_key: abcontact_sk
      alias: ab_abcontact
      strategy: check
      check_cols: ["hash_key"]
      hard_deletes: new_record
      tags: ["layer:curated","model:snapshot","module:gwab","domain:contact_manager", "criticality:non_business_critical", "entity:ab_abcontact"]
      snapshot_meta_column_names:
        # Maps dbt_valid_from to column 'valid_from' - start of record validity
        dbt_valid_from: valid_from
        # Maps dbt_valid_to to column 'valid_to' - end of record validity
        dbt_valid_to: valid_to
        # Surrogate key for each snapshot record - keeping dbt default name
        dbt_scd_id: scd_id
        # Maps dbt_is_deleted to 'is_deleted' - flags hard deletes from source
        dbt_updated_at: modified_date
        # Maps dbt_is_deleted to 'is_deleted' - flags hard deletes from source
        dbt_is_deleted: is_deleted

      # Set far-future date for current/open records instead of NULL
      dbt_valid_to_current: "to_date('2999-12-31')"
                            

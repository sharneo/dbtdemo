version: 2
models:
-  name: stg_cc_address
   description: "Incremental staging model for Guidewire Claim Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: obfuscatedinternal
      description: "Flag to let us know if the bean has been obfuscated."
      tests:
      -  not_null:
            name: gwcc_cc_address_obfuscatedinternal_not_null
            config:
               severity: warn
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_address_publicid_not_null
            config:
               severity: warn
   -  name: batchgeocode
      description: "Boolean field to mark an address to be geocoded (if needed) by the batch geocoding work queue."
      tests:
      -  not_null:
            name: gwcc_cc_address_batchgeocode_not_null
            config:
               severity: warn
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_address_createtime_not_null
            config:
               severity: warn
   -  name: addressline1
      description: "First line of mailing address."
   -  name: addressline2
      description: "Second line of mailing address."
   -  name: county
      description: "County."
   -  name: addressline3
      description: "Third line of mailing address."
   -  name: citykanji
      description: "City in kanji (used only for Japanese addresses and will be null otherwise)"
   -  name: spatialpoint
      description: "Latitude and longitude of this address, represented as an instance of SpatialPoint."
   -  name: addressline2kanji
      description: "Second line of mailing address in kanji (used only for Japanese addresses and will be null otherwise)"
   -  name: state
      description: "State."
   -  name: addressbookuid
      description: "The system uses this value when it is integrated with ContactManager and the related contact is linked.  In this case, the ID represents the ID of the corresponding entity in ContactManager. This value is null if the object is not linked."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_address_updatetime_not_null
            config:
               severity: warn
   -  name: country
      description: "Country."
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_address_id_not_null
            config:
               severity: warn
   -  name: standardizedaddressid_icare
      description: ""
   -  name: isvalidated_icare
      description: ""
   -  name: externallinkid
      description: "The external link ID suggested by CC to CM when linkID is null but has been created in CC. "
   -  name: createuserid
      description: "User who created the object"
   -  name: isaddressfrompc_icare
      description: "Did this address come from policy center"
   -  name: validuntil
      description: "Latest date that this address is valid."
   -  name: dpid_icare
      description: "Australia Post, Delivery Point Identifier"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: citydenorm
      description: "denorm field for City."
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_address_retired_not_null
            config:
               severity: warn
   -  name: city
      description: "City."
   -  name: addresstype
      description: "Type of this address record."
   -  name: addressline1kanji
      description: "First line of mailing address in kanji (used only for Japanese addresses and will be null otherwise)"
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: cedexbureau
      description: "CEDEX: Special business mail delivery bureau (used only for French addresses and will be null otherwise)"
   -  name: geocodestatus
      description: "Enum giving the status of the latitude and longitude data."
   -  name: cedex
      description: "CEDEX: Special business mail delivery flag (used only for French addresses and will be null otherwise)"
   -  name: postalcodedenorm
      description: "denorm field for Postal code; string to handle Zip+4 and international codes."
   -  name: postalcode
      description: "Postal code; string to handle Zip+4 and international codes."
   -  name: subtype
      description: "Identifies a particular subtype within a supertype table; each subtype of a supertype has its own unique subtype value"
      tests:
      -  not_null:
            name: gwcc_cc_address_subtype_not_null
            config:
               severity: warn
   -  name: description
      description: "Additional description of mailing address."
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

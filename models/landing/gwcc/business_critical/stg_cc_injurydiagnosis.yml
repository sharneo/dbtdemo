version: 2
models:
-  name: stg_cc_injurydiagnosis
   description: "Incremental staging model for Guidewire Claim Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: createuserid
      description: "User who created the object"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_injurydiagnosis_publicid_not_null
            config:
               severity: warn
   -  name: injuryincidentid
      description: "Injury incident this diagnosis is related to"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_injurydiagnosis_createtime_not_null
            config:
               severity: warn
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_injurydiagnosis_retired_not_null
            config:
               severity: warn
   -  name: dateended
      description: "The date this diagnosis was ended"
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: injuryseverity_icare
      description: "Injury Severity"
   -  name: datestarted
      description: "The date this diagnosis was started"
   -  name: comments
      description: "Comments"
   -  name: compensable
      description: "Is this diagnosis compensable"
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_injurydiagnosis_updatetime_not_null
            config:
               severity: warn
   -  name: icdcode
      description: "Key to selected ICD"
      tests:
      -  not_null:
            name: gwcc_cc_injurydiagnosis_icdcode_not_null
            config:
               severity: warn
   -  name: isprimary
      description: "Indicates if this is the primary diagnosis on the incident"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_injurydiagnosis_id_not_null
            config:
               severity: warn
   -  name: contactid
      description: "Provider name"
   -  name: payable_icare
      description: ""
   -  name: legacycreatetime_ext
      description: ""
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

      description: "icare specific field to hold ESR details"
   -  name: fixedid
      description: ""
      tests:
      -  not_null:
            name: gwpc_pc_effectivedatedfields_fixedid_not_null
            config:
               severity: warn
   -  name: primarynamedinsured
      description: "The primary named insured on the policy."
      tests:
      -  not_null:
            name: gwpc_pc_effectivedatedfields_primarynamedinsured_not_null
            config:
               severity: warn
   -  name: exppremium_icare_cur
      description: "Currency for Experience Premium"

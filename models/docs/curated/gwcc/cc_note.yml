version: 2
models:
-  name: cc_note
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_note_publicid_not_null
            config:
               severity: warn
   -  name: confidential
      description: "Whether the note is confidential."
      tests:
      -  not_null:
            name: gwcc_cc_note_confidential_not_null
            config:
               severity: warn
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_note_createtime_not_null
            config:
               severity: warn
   -  name: casemanagementservicesubject
      description: "Subject type for rehab plan"
   -  name: rehabplanservices_icareid
      description: "The Rehab Plan Service this Note is associated to, if it is part of a Rehab Plan Service"
   -  name: servicerequestid
      description: "Associated service request."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_note_updatetime_not_null
            config:
               severity: warn
   -  name: claimid
      description: "Associated claim."
      tests:
      -  not_null:
            name: gwcc_cc_note_claimid_not_null
            config:
               severity: warn
   -  name: language
      description: "The language in which this note is created."
   -  name: portalauthorrealm_ext
      description: "The security realm of the portal user which created the note. A realm identifies a collection of users and groups."
   -  name: dispute_icareid
      description: "Associated dispute"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_note_id_not_null
            config:
               severity: warn
   -  name: matterid
      description: "Associated matter."
   -  name: workcapacity_icareid
      description: "Associated work capacity decision."
   -  name: createuserid
      description: "User who created the object"
   -  name: exposureid
      description: "Associated exposure."
   -  name: body
      description: "Body of the note."
   -  name: authoringdate
      description: "Date on which the note was originally authored.  If null, the CreateTime seves this purpose."
   -  name: authorid
      description: "User who wrote the note."
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_note_retired_not_null
            config:
               severity: warn
   -  name: activityid
      description: "The activity associated with the note."
   -  name: subject
      description: "Subject or summary of the note."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: topic
      description: "Topic to which the note belongs."
   -  name: portalauthorusername_ext
      description: "The username of the portal user which created the note"
   -  name: securitytype
      description: "Type of note; used for access-restriction purposes"
   -  name: claimcontactid
      description: "Associated Claim Contact (either a person or a company)."
   -  name: mspreferral_extid
      description: ""
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

version: 2

models:
  - name: ms_qlk_aspire_claim_txn
    description: "Transaction records for claim payments including approval status, lifecycle state, and cost categorization"
    columns:
      - name: claim_txn_sk
        description: "Surrogate key for the transaction"
        tests:
          - not_null
          - unique
      - name: claim_sk
        description: "Surrogate key for the claim"
        tests:
          - not_null
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
      - name: src_claim_id
        description: "Source system claim ID"
        tests:
          - not_null
      - name: adj_payment_ind
        description: "Indicates if this is an adjustment payment"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: migrated_txn_ind
        description: "Indicates if transaction was migrated from legacy system"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

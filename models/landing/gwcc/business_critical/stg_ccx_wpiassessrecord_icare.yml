   -  name: complyingagreementdate_icare
      description: "Date when complying agreement was reached"
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: claimedpercentage_icare
      description: "WPI percentage claimed"
   -  name: approved_icare
      description: "icare user to approve WPI record"
      tests:
      -  not_null:
            name: gwcc_ccx_wpiassessrecord_icare_approved_icare_not_null
            config:
               severity: warn
   -  name: hasbackinjury_icare

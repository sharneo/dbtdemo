version: 2

models:
  - name: ms_qlk_aspire_claim_risk_factor
    description: "Risk factors identified during claim triage assessment"
    columns:
      - name: src_risk_factor_id
        description: "Source system risk factor ID"
        tests:
          - not_null
          - unique
      - name: src_claim_id
        description: "Source system claim ID"
        tests:
          - not_null
      - name: new_risk_factor_ind
        description: "Indicates if this is a newly identified risk factor"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: retired_ind
        description: "Indicates if the risk factor has been retired"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

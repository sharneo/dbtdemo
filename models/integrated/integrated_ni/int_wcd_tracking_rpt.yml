version: 2
models:
-  name: int_wcd_tracking_rpt
   description: "Integrated WCD tracking report model sourced from Guidewire CC. Tracks work capacity decisions with payment impacts and managing entity context. Original SAS source: W01_WCD_TRACKING_RPT.sas"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber) - primary key"
      tests:
      -  unique:
            name: int_wcd_tracking_rpt_claim_sk_unique
            config:
               severity: warn
      -  not_null:
            name: int_wcd_tracking_rpt_claim_sk_not_null
            config:
               severity: warn
   -  name: src_system_cd
      description: "Source system code"
   -  name: managing_entity_id
      description: "Managing entity ID"
   -  name: managing_entity_sk
      description: "Surrogate key for managing entity"
      tests:
      -  not_null:
            name: int_wcd_tracking_rpt_managing_entity_sk_not_null
            config:
               severity: warn
   -  name: managing_entity_cd
      description: "Managing entity code"
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_wcd_tracking_rpt_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_wcd_tracking_rpt_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: src_claim_id
      description: "Source claim ID"
      tests:
      -  not_null:
            name: int_wcd_tracking_rpt_src_claim_id_not_null
            config:
               severity: warn
   -  name: wcd_reference_nbr
      description: "WCD reference number"
   -  name: wcd_effective_dt
      description: "WCD effective date"
   -  name: wcd_weekly_pymt_impact
      description: "WCD weekly payment impact code"
   -  name: wcd_weekly_pymt_impact_desc
      description: "WCD weekly payment impact description"
   -  name: segment
      description: "Claim segment"
   -  name: team
      description: "Assigned team"
   -  name: case_owner_name
      description: "Case owner name"
   -  name: post_wcd_payment_amount
      description: "Post-WCD payment amount"
   -  name: last_payment_to_dt
      description: "Last payment to date"
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_wcd_tracking_rpt_file_ingestion_timestamp_not_null
            config:
               severity: warn

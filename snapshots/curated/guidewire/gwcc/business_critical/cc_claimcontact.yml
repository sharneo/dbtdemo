      description: "Type essential service provided by contact"
   -  name: benefitendreasontype
      description: "Reason benefits ended - typelist"
   -  name: createuserid
      description: "User who created the object"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: contactnamedenorm
      description: "denormalization of contact name, to speed up search for claim by contact name"
   -  name: benefitendreason
      description: "Reason benefits ended (deprecated in favor of BenefitEndReasonType)"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_claimcontact_retired_not_null
            config:
               severity: warn
   -  name: providertype
      description: "Provider type"
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: personlastnamedenorm
      description: "denormalization of person last name, to speed up search for claim by person name"
   -  name: service
      description: "The service provided by contact"
   -  name: dependenttype
      description: "Type of dependent - spouse, child etc."
   -  name: contactid
      description: "Contact associated with the claim or exposure."
      tests:

version: 2
models:
-  name: cc_policylocation
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: notes
      description: "Any notes associated with this location."
   -  name: createuserid
      description: "User who created the object"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_policylocation_publicid_not_null
            config:
               severity: warn
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_policylocation_retired_not_null
            config:
               severity: warn
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_policylocation_createtime_not_null
            config:
               severity: warn
   -  name: policyid
      description: "This PolicyLocations owning Policy."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: addressid
      description: "The address where this PolicyLocation exists."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_policylocation_updatetime_not_null
            config:
               severity: warn
   -  name: primarylocation
      description: "Indicates whether this PolicyLocation should be considered the primary one on the owning Policy."
      tests:
      -  not_null:
            name: gwcc_cc_policylocation_primarylocation_not_null
            config:
               severity: warn
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_policylocation_id_not_null
            config:
               severity: warn
   -  name: policysystemid
      description: "Identifier for the policy location in an external policy system"
   -  name: locationcode_icare
      description: "The custom location code specified by customer"
   -  name: locationnumber
      description: "The alphanumeric \"number\" associated with this location."

version: 2

models:
  - name: msc_qlk_aspire_accident
    description: >
      Integrated accident/incident model sourced from GuidewireCC.
      Combines claim, incident, policy location, work comp, and subrogation
      data to produce one row per claim with injury incident details.
      Original SAS source: 01_ACCIDENT.sas (TBL_NM: MSC_QLK_ASPIRE_ACCIDENT)
    columns:
      - name: claim_sk
        description: Surrogate key for the claim (MD5 hash of source_system + claim number)
      - name: source_system
        description: Source system identifier (e.g. GWCC)
      - name: src_claim_id
        description: Source claim ID from CC_CLAIM
      - name: claim_nbr
        description: Claim number from GuidewireCC
      - name: recovery_investigation_ind
        description: Y/N indicator whether a subrogation/recovery investigation exists for the claim
      - name: policy_location_addr
        description: Concatenated policy location address (address lines, city, postal code)
      - name: toocs_mechanism_of_injury_desc
        description: TOOCS mechanism of injury description from the incident
      - name: accident_location_type_cd
        description: Accident location type code from cctl_accidentloctype_icare
      - name: accident_location_type_desc
        description: Accident location type description from cctl_accidentloctype_icare
      - name: file_ingestion_timestamp
        description: Timestamp of file ingestion, used as incremental filter

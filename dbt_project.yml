# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'icare_dbt_transformations_fndn'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'icare_dbt_transformations_fndn'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  'dbt_date:time_zone': 'Australia/Sydney'
  disable_dbt_artifacts_autoupload: true

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
# AF Changes

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
    icare_dbt_transformations_fndn:
      +transient: false
      +sql_header: "alter SESSION set QUOTED_IDENTIFIERS_IGNORE_CASE = TRUE;"
      landing:
        +transient: false
        +enabled: true
        +persist_docs:
          relation: true
          columns: true
        +materialized: view
        +database: DEV_RAW_DB
        gwpc:
         +schema: gwpc 
        gwcc:
         +schema: gwcc 
        gwab:
         +schema: gwab 
        gwbc:
         +schema: gwbc 
        salesforce:
         +schema: salesforce 
        genesys:
         +schema: genesys 
      curated:
        +database: DEV_CURATED_DB
        +transient: false
        +persist_docs:
          relation: true
          columns: true
        gwpc:
         +schema: gwpc 
        gwcc:
         +schema: gwcc
        gwab:
         +schema: gwab
        gwbc:
         +schema: gwbc
      reporting:
        +database: DEV_REPORTING_DB
        +transient: false
        +persist_docs:
          relation: true
          columns: true
      data_products:
        +database: DEV_REPORTING_DB
        +transient: false
        sira:
         +schema: sira 
        aspire:
         +schema: sira 
    dbt_artifacts:
      +database: DEV_RAW_DB # optional, default is your target database
      +schema: ELT_UTILS # optional, default is your target schema
      staging:
        +database: DEV_RAW_DB # optional, default is your target database
        +schema: ELT_UTILS # optional, default is your target schema
      sources:
        +database: DEV_RAW_DB # optional, default is your target database
        +schema: ELT_UTILS # optional, default is your target schema
    elementary:
      +database: DEV_RAW_DB
      +schema: "elementary"
snapshots:
  icare_dbt_transformations_fndn:   # folder where all your snapshots live
    +target_database: DEV_CURATED_DB
    +persist_docs:
      relation: true
      columns: true
on-run-end:
  - "{% if target.name == 'prod' %}{{ dbt_artifacts.upload_results(results) }}{% endif %}"
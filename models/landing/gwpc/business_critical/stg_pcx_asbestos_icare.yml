version: 2
models:
-  name: stg_pcx_asbestos_icare
   description: "Incremental staging model for Guidewire Policy Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader"
   -  name: grosswagesforasbestoshandling
      description: ""
   -  name: createuserid
      description: "User ID of the user that created this record. Foreign key to PC_USER"
   -  name: noofworkersexposed
      description: ""
   -  name: publicid
      description: ""
      tests:
      -  not_null:
            name: gwpc_pcx_asbestos_icare_publicid_not_null
            config:
               severity: warn
   -  name: descriptionofwork
      description: ""
   -  name: archivepartition
      description: "Internal technical GW field to manage archiving"
   -  name: beanversion
      description: "Internal technical GW field to manage object versions."
   -  name: createtime
      description: "Timestamp indicating when the record was created in the GW table"
      tests:
      -  not_null:
            name: gwpc_pcx_asbestos_icare_createtime_not_null
            config:
               severity: warn
   -  name: changetype
      description: "Type of change made to this row"
   -  name: directwage_icare
      description: ""
      tests:
      -  not_null:
            name: gwpc_pcx_asbestos_icare_directwage_icare_not_null
            config:
               severity: warn
   -  name: basedonid
      description: "Link to the row on which this row is based; or null if new to branch"
   -  name: updateuserid
      description: "User ID of the user that updated this record. Foreign key to PC_USER."
   -  name: fixedid
      description: "Unique ID for the object across all branches and periods"
      tests:
      -  not_null:
            name: gwpc_pcx_asbestos_icare_fixedid_not_null
            config:
               severity: warn
   -  name: wic
      description: ""
   -  name: effectivedate
      description: ""
   -  name: updatetime
      description: ""
      tests:
      -  not_null:
            name: gwpc_pcx_asbestos_icare_updatetime_not_null
            config:
               severity: warn
   -  name: id
      description: "Internally managed primary key,  Provides traceability back to PCX_ASBESTOS_ICARE when Wage Type = Asbestos"
      tests:
      -  not_null:
            name: gwpc_pcx_asbestos_icare_id_not_null
            config:
               severity: warn
   -  name: branchid
      description: "Link to root of effdated tree.  Foreign key to PC_POLICYPERIOD in GW (Policy Period = EDW Policy Term)"
      tests:
      -  not_null:
            name: gwpc_pcx_asbestos_icare_branchid_not_null
            config:
               severity: warn

version: 2

snapshots:
  - name: bpc_fiscyear_snapshot
    description: |
      SCD Type 2 history of BPC Fiscal Year dimension master data.
      Grain: one row per version of each BPC fiscal year dimension record.
      Source system: SAP BPC.
    columns:
      - name: bpc_fiscyear_sk
        description: Surrogate key for this BPC fiscal year record, generated from [sid]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: sid
        description: BPC internal surrogate identifier for the fiscal year dimension record.

      - name: fiscvarnt
        description: Fiscal Year Variant (e.g., K4 for calendar year, V3 for Jul-Jun).

      - name: fiscyear
        description: Fiscal Year value (e.g., 2024, 2025).

      - name: chckfl
        description: Check flag indicator for BPC dimension data validation.

      - name: datafl
        description: Data flag indicator. Controls whether this dimension record is active for data processing.

      - name: incfl
        description: Include flag indicator. Controls whether this dimension record is included in consolidation processing.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

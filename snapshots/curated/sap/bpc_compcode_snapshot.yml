version: 2

snapshots:
  - name: bpc_compcode_snapshot
    description: |
      SCD Type 2 history of BPC Company Code dimension master data.
      Grain: one row per version of each BPC company code dimension record.
      Source system: SAP BPC.
    columns:
      - name: bpc_compcode_sk
        description: Surrogate key for this BPC company code record, generated from [sid]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid. Set to the snapshot run timestamp when this version was first detected.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL indicates the currently active version.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change to this record.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version generated by dbt snapshot.

      - name: sid
        description: BPC internal surrogate identifier for the company code dimension record.

      - name: b631_s_compcode
        description: Company Code identifier from BPC dimension master data. Maps to SAP T001 company code values.

      - name: chckfl
        description: Check flag indicator for BPC dimension data validation.

      - name: datafl
        description: Data flag indicator. Controls whether this dimension record is active for data processing.

      - name: incfl
        description: Include flag indicator. Controls whether this dimension record is included in consolidation processing.

      - name: RECORDTYPE
        description: Record type indicator from the source system. Used to filter operational (D) records from administrative entries.

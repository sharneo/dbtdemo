version: 2
snapshots:
-  name: cc_matter
   columns:
   -  name: punitivedamages
      description: "Punitive damages?"
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: previousgroupid
      description: "Group to which this entity was previously assigned."
   -  name: firstnotice
      description: "Whether the lawsuit was the first notice of the claim."
   -  name: risktype
      description: "Describes the overall risk on this matter."
   -  name: assignedbyuserid
      description: "User who assigned this entity."
   -  name: name
      description: "Then name for this matter. Typically of the form X vs. Y once the matter goes to trial."
      tests:
      -  not_null:
            name: gwcc_cc_matter_name_not_null
            config:
               severity: warn
   -  name: declaratoryjgmt
      description: "Whether the court has been asked to make a declaratory judgment."
   -  name: finalsettlecost
      description: "The final settlement cost."
   -  name: subrorelated
      description: "Boolean field to mark if Matter related to Subrogation"
   -  name: hearingroom
      description: "Room number in the hearing venue."
   -  name: responsedue
      description: "Response Due"
   -  name: keyissues_icare
      description: "Free text field to note any key issues"
   -  name: previousqueueid
      description: "Queue to which this entity was previously assigned."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_matter_updatetime_not_null
            config:
               severity: warn
   -  name: courtdistrict
      description: "Court jurisdictional district"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_matter_id_not_null
            config:
               severity: warn
   -  name: reopenedreason
      description: "The reason for reopening the matter."
   -  name: raiseddate_icare
      description: "Date litigation is raised"
   -  name: createuserid
      description: "User who created the object"
   -  name: closedate
      description: "Date and time when this entity was closed. (Not applicable to all assignable entities)"
   -  name: mediationdate
      description: "Date this matter entered mediation."
   -  name: primarycause
      description: "Why the lawsuit was brought in the first place."
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_matter_retired_not_null
            config:
               severity: warn
   -  name: filedate
      description: "Date the trial was filed in court."
   -  name: wpi_icare
      description: "Flag if the matter is related to a WPI decision"
   -  name: validationlevel
      description: "Validation level the matter passed (if any) the last time it was checked."
   -  name: resolution
      description: "The type of resolution."
   -  name: arbitrationdate
      description: "Current schedule trial date."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: othermattersubtypetext_icare
      description: "Free text for Other matter type sub type"
   -  name: commonlawid
      description: "Link to Common Law object"
   -  name: punitiveamount
      description: "Punitive damages amount"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_matter_publicid_not_null
            config:
               severity: warn
   -  name: trialdate
      description: "Current schedule trial date."
   -  name: courttype
      description: "Court type"
   -  name: suittype
      description: "The type of suit."
   -  name: responsefiled
      description: "Response filed"

version: 2

snapshots:
  - name: hierarchy_header_snapshot
    description: |
      SCD Type 2 history of SAP Hierarchy/Set Headers (SETHEADER).
      Grain: one row per version of each hierarchy header.
      Stores the header metadata for sets and hierarchies used in financial reporting and allocations.
    columns:
      - name: hierarchy_header_sk
        description: Surrogate key for this hierarchy header record, generated from [setclass, subclass, setname, subsetname]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: setclass
        description: Set Class (SAP SETCLASS). Categorizes the set type (e.g., 0001 = cost centers, 0002 = G/L accounts).

      - name: subclass
        description: Subclass of the set within the set class.

      - name: setname
        description: Set Name. Unique name identifying the hierarchy or set.

      - name: subsetname
        description: Subset Name. Identifies a specific subset within a named set.

      - name: lineid
        description: Line Identifier within the subset structure.

      - name: subsetcls
        description: Subset Class. Classifies the subset type.

      - name: subsetscls
        description: Sub-subset Class. Further classification within the subset.

      - name: seqnr
        description: Sequence Number. Ordering of items within the hierarchy structure.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

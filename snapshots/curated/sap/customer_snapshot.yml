version: 2

snapshots:
  - name: customer_snapshot
    description: |
      SCD Type 2 history of SAP Customer Master data (KNA1 + KNB1).
      Grain: one row per version of each customer at company code level.
      Stores customer contact details, account group, tax data, payment terms, and credit control information.
    columns:
      - name: customer_sk
        description: Surrogate key for this customer record, generated from [kunnr, bukrs]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: kunnr
        description: Customer Number (SAP KUNNR). Unique identifier for the customer master record.

      - name: bukrs
        description: Company Code (SAP BUKRS). Company code for this customer's accounting view.

      - name: land1
        description: Country Key (SAP LAND1). Country of the customer's primary address.

      - name: name1
        description: Customer Name (Line 1). Primary name of the customer.

      - name: name2
        description: Customer Name (Line 2). Secondary name or additional address line.

      - name: ort01
        description: City (SAP ORT01). City of the customer's primary address.

      - name: pstlz
        description: Postal Code (SAP PSTLZ). Postal code of the customer's address.

      - name: regio
        description: Region / State (SAP REGIO). State or province of the customer's address.

      - name: sortl
        description: Sort Field (SAP SORTL). Search term for the customer master.

      - name: stras
        description: Street Address (SAP STRAS). Street name and number of the customer's address.

      - name: telf1
        description: Telephone Number (SAP TELF1). Primary telephone number for the customer.

      - name: telfx
        description: Fax Number. Fax number for the customer.

      - name: ktokd
        description: Customer Account Group (SAP KTOKD). Groups customers for master data configuration and reporting.

      - name: vbund
        description: Trading Partner (SAP VBUND). Company ID for intercompany customer relationships.

      - name: stceg
        description: VAT Registration Number (SAP STCEG). Tax registration number for the customer.

      - name: erdat
        description: Created On (SAP ERDAT). Date when the customer master was created.

      - name: zuawa
        description: Key Word Sorting (SAP ZUAWA). Sorting criterion for account determination.

      - name: akont
        description: Reconciliation Account (SAP AKONT). G/L account used for automatic posting to customer accounts.

      - name: zwels
        description: Payment Methods (SAP ZWELS). Allowed payment methods for this customer.

      - name: zterm
        description: Terms of Payment (SAP ZTERM). Payment terms for this customer.

      - name: zsabe
        description: Payee Code for Payment Method. Identifies the payee for electronic payments.

      - name: fdgrv
        description: Cash Management Group (SAP FDGRV). Grouping for cash management and forecasting.

      - name: frgrp
        description: Release Group (SAP FRGRP). Credit management release group.

      - name: intad
        description: Interest Calculation Indicator. Defines interest calculation method for overdue items.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

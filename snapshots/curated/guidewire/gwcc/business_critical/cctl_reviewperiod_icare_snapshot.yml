snapshots:
  - name: cctl_reviewperiod_icare_snapshot
    relation: ref('stg_cctl_reviewperiod_icare')
    config:
      schema: GWCC
      unique_key: reviewperiod_icare_sk
      alias: cctl_reviewperiod_icare
      strategy: check
      check_cols: ["hash_key"]
      hard_deletes: new_record
      tags: ["curated","gwcc","claim_centre", "business_critical"]
      snapshot_meta_column_names:
        dbt_valid_from: valid_from
        dbt_valid_to: valid_to
        dbt_scd_id: scd_id
        dbt_updated_at: modified_date
        dbt_is_deleted: is_deleted

      dbt_valid_to_current: "to_date('9999-12-31')"

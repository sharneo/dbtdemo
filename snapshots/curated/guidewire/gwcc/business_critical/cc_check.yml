version: 2
snapshots:
-  name: cc_check
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: ocr_invoice_icare
      description: "The ocr invoice that was used to create this check"
   -  name: issuedate
      description: "Date the check was issued."
   -  name: dateofservice
      description: "Date that the service was performed (if this check is for a service)."
   -  name: lastpostingdate_icare
      description: ""
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_check_updatetime_not_null
            config:
               severity: warn
   -  name: isprimary
      description: "Indicates if this is the primary EFT record for the contact"
   -  name: servicepdstart
      description: "Start date of the service period for the check."
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_check_id_not_null
            config:
               severity: warn
   -  name: pendescalationforbulk
      description: "Only escalate as part of a BulkInvoice."
   -  name: deductiontype
      description: "Deduction type for secondary checks.  Always NULL for primary checks."
   -  name: paytodenorm
      description: "denorm field for Pay to the order of."
   -  name: createuserid
      description: "User who created the object"
   -  name: payto
      description: "Pay to the order of."
   -  name: mailingaddressid
      description: "Address of the person/company to whom the check should be mailed. This represents an Address entity."
   -  name: bankbranchname_icare
      description: ""
   -  name: recurringcheckid
      description: "The recurring check entity, if any, associated with this check."
   -  name: datepresented_icare
      description: "Date the Check was presented. Not used for EFTs"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: abn_icare
      description: ""
   -  name: commmethod_icare
      description: ""
      tests:
      -  not_null:
            name: gwcc_cc_check_commmethod_icare_not_null
            config:
               severity: warn
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_check_retired_not_null
            config:
               severity: warn
   -  name: bankaccounttype
      description: "The type of bank accout e.g. checking, savings etc"
   -  name: recurrence_icare
      description: ""
   -  name: checkinstructions
      description: "Special handling instructions for the check."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: dbnetamount_icare
      description: "The Net Amount for the check. Populated using the NetAmount property during FinancialsEscalation."
   -  name: invoicenumber
      description: "Invoice number associated with the check."
   -  name: bulkinvoiceiteminfoid
      description: "If this check was created to act as a record-keeper for a bulk invoice item, this is the item it references."
   -  name: accountname
      description: "The name on the account"
   -  name: foreigncurrencyamount_icare
      description: "Foreign Currency Amount"
   -  name: payeewithnoabn_icare
      description: ""
   -  name: memo
      description: "Memo to include on the check."
   -  name: istotalgt82_icare
      description: "Is the total more than MaxPaymentWithoutABN"
   -  name: bankswiftcode_icare
      description: ""
   -  name: portionid
      description: "The amount of a multi-payee check applicable to this check."
   -  name: checktype
      description: "Role of the check in the check group (primary or secondary)."
      tests:
      -  not_null:
            name: gwcc_cc_check_checktype_not_null
            config:
               severity: warn
   -  name: mailtoaddress
      description: "Address of the person/company to whom the check should be mailed."
   -  name: transactionidentifier_icare
      description: "Transaction ID"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_check_publicid_not_null
            config:
               severity: warn
   -  name: enteredtime
      description: "The time the check was created. This is different from CreateTime, which is the time it was stored in the system."
   -  name: bankname
      description: "The name of the bank"
   -  name: weeklybenefitpayeetype_icare
      description: ""
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_check_createtime_not_null
            config:
               severity: warn
   -  name: deductionidentifier_icare
      description: "Deduction Identifier"
   -  name: checknumber
      description: "The check or EFT identifier."
   -  name: servicepdend
      description: "End date of the service period for the check."
   -  name: bankroutingnumber
      description: "The routing number is a nine digit bank code used in the United States"
   -  name: emailaddress_icare
      description: ""
   -  name: servicesprovidedoverseas_icare
      description: "Boolean field for Manual Invoice Payment"
   -  name: currencytransacted_icare
      description: "The actual currency that the Payment was made in for Manual Payments"
   -  name: deliverymethod
      description: "Requested delivery method."
   -  name: originalmigratedstatus_icare
      description: ""
   -  name: claimid
      description: "The related claim."
      tests:
      -  not_null:
            name: gwcc_cc_check_claimid_not_null
            config:
               severity: warn
   -  name: aggregateremittance_icare
      description: ""
   -  name: westpacid_icare
      description: ""
   -  name: groupid
      description: "CheckGroup this check belongs to, if its part of a multi-payee check."
   -  name: registeredforgst_icare
      description: ""
   -  name: datepaymenttransacted_icare
      description: "Date that the manual payment was made"
   -  name: accrued_icare
      description: ""
      tests:
      -  not_null:
            name: gwcc_cc_check_accrued_icare_not_null
            config:
               severity: warn
   -  name: scheduledsenddate
      description: "Date that the check is scheduled to be sent.  Also used to determine if the check amount is included in Future Payments (tomorrow or later).  Should only be modified in the UI or PreSetup rules."
   -  name: isinvoiceissuedto_icare
      description: "Is Invoice Issued To Y/N"
   -  name: previouschecktype_icare
      description: ""
   -  name: reportableamount
      description: "Reportable amount of the check in the transaction currency. Used by the BackupWithholdingCalculator as the amount of the check reportable to the IRS, from which it calculates backup withholding Deductions. It is editable in the UI."
   -  name: paymentmethod
      description: "Requested payment method for all payments in the check."
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: gstmethodpel_ext
      description: "GST Method typecode"
      tests:
      -  not_null:
            name: gwcc_cc_check_gstmethodpel_ext_not_null
            config:
               severity: warn
   -  name: checkbatching
      description: "How the check should be batched for sending."
   -  name: bankaccount
      description: "Source bank account."
   -  name: mailto
      description: "Name of the person/company to whom the check should be mailed."
   -  name: status
      description: "Status of the check (issued, voided, cleared, and so on). Do not update directly. Use methods to initiate operations, or use updateCheckStatus() method."
      tests:
      -  not_null:
            name: gwcc_cc_check_status_not_null
            config:
               severity: warn
   -  name: comments
      description: "Comments about the check, such as a reason it was voided."
   -  name: checksetid
      description: "CheckSet this Check belongs to."
      tests:
      -  not_null:
            name: gwcc_cc_check_checksetid_not_null
            config:
               severity: warn
   -  name: reportability
      description: "Whether the payment should be reported to the IRS as income."
   -  name: voidedpaymentnumber_icare
      description: "The number of the payment that was voided to create this one"
   -  name: bankaccountnumber
      description: "The bank account number"
   -  name: prepostpayg_icare
      description: "Whether the deduction is to be transacted net or gross wages payment (where weeklies)"
   -  name: gstpaymentclasspel_ext

version: 2

models:
  - name: msc_qlk_aspire_claim_security
    description: >
      Integrated claim security model sourced from GuidewireCC.
      Combines claim, managing entity, claims agent, policy, and policy type
      data to produce one row per claim with security/agent details.
      Original SAS source: 62_CLAIM_SECURITY.sas (TBL_NM: MSC_QLK_ASPIRE_CLAIM_SECURITY)
    columns:
      - name: claim_sk
        description: Surrogate key for the claim (MD5 hash of source_system + claim number)
      - name: source_system
        description: Source system identifier from the driving CTE (e.g. GWCC)
      - name: src_claim_id
        description: Source claim ID from CC_CLAIM
      - name: claim_nbr
        description: Claim number from GuidewireCC
      - name: managing_entity_cd
        description: Managing entity code from ccx_managingentity_icare
      - name: managingentity_name
        description: Managing entity name from ccx_managingentity_icare
      - name: insurernumber
        description: Insurer number derived from ClaimsAgent or LodgingAgent (NVL logic)
      - name: policynumber
        description: Policy number from cc_policy
      - name: policytype_id
        description: Policy type ID (foreign key) from cc_policy
      - name: policytype_cd
        description: Policy type code from cctl_policytype
      - name: file_ingestion_timestamp
        description: Timestamp of file ingestion, used as incremental filter

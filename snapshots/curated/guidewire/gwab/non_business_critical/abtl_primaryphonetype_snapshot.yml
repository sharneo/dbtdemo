snapshots:
  - name: abtl_primaryphonetype_snapshot
    relation: ref('stg_abtl_primaryphonetype')
    config:
      schema: GWAB
      unique_key: primaryphonetype_sk
      alias: abtl_primaryphonetype
      strategy: check
      check_cols: ["hash_key"]
      hard_deletes: new_record
      tags: ["curated","gwab","contact_manager", "non_business_critical"]
      snapshot_meta_column_names:
        dbt_valid_from: valid_from
        dbt_valid_to: valid_to
        dbt_scd_id: scd_id
        dbt_updated_at: modified_date
        dbt_is_deleted: is_deleted

      dbt_valid_to_current: "to_date('9999-12-31')"

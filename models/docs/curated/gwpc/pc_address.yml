version: 2
models:
-  name: pc_address
   columns:
   -  name: locationname
      description: "Shorthand name for this location"
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwpc_pc_address_publicid_not_null
            config:
               severity: warn
   -  name: batchgeocode
      description: "Boolean field to mark an address to be geocoded (if needed) by the batch geocoding work queue."
      tests:
      -  not_null:
            name: gwpc_pc_address_batchgeocode_not_null
            config:
               severity: warn
   -  name: active
      description: "Determines whether or not the location is available to be newly added to submissions"
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwpc_pc_address_createtime_not_null
            config:
               severity: warn
   -  name: addressline1
      description: "First line of mailing address."
   -  name: addressline2
      description: "Second line of mailing address."
   -  name: county
      description: "County."
   -  name: addressline3
      description: "Third line of mailing address."
   -  name: citykanji
      description: "City in kanji (used only for Japanese addresses and will be null otherwise)"
   -  name: spatialpoint
      description: "Latitude and longitude of this address, represented as an instance of SpatialPoint."
   -  name: addressline2kanji
      description: "Second line of mailing address in kanji (used only for Japanese addresses and will be null otherwise)"
   -  name: phoneextension
      description: "Phone extension"
   -  name: state
      description: "State."
   -  name: addressbookuid
      description: "The system uses this value when it is integrated with ContactManager and the related contact is linked. In this case, the ID represents the ID of the corresponding entity in ContactManager. This value is null if the object is not linked."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwpc_pc_address_updatetime_not_null
            config:
               severity: warn
   -  name: country
      description: "Country."
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwpc_pc_address_id_not_null
            config:
               severity: warn
   -  name: isvalidated_icare
      description: "To check whether address is validated or not"
   -  name: employeecount
      description: "The number of employees at this location"
   -  name: locationcode
      description: "The custom location code specified by customer"
   -  name: createuserid
      description: ""
   -  name: validuntil
      description: "Latest date that this address is valid."
   -  name: phonecountry
      description: "The country associated with this phone number."
   -  name: beanversion
      description: ""
   -  name: citydenorm
      description: "denorm field for City."
   -  name: retired
      description: ""
      tests:
      -  not_null:
            name: gwpc_pc_address_retired_not_null
            config:
               severity: warn
   -  name: city
      description: "City."
   -  name: lastupdatetime
      description: "Date and time of last update"
   -  name: account
      description: "The account on which this is a location"
   -  name: phone
      description: "Phone"
   -  name: addresstype
      description: "Type of this address record."
   -  name: addressline1kanji
      description: "First line of mailing address in kanji (used only for Japanese addresses and will be null otherwise)"
   -  name: updateuserid
      description: ""
   -  name: cedexbureau
      description: "CEDEX: Special business mail delivery bureau (used only for French addresses and will be null otherwise)"
   -  name: geocodestatus
      description: "Enum giving the status of the latitude and longitude data."
   -  name: locationnum
      description: "The location number of this location"
   -  name: cedex
      description: "CEDEX: Special business mail delivery flag (used only for French addresses and will be null otherwise)"
   -  name: postalcodedenorm
      description: "denorm field for Postal code; string to handle Zip+4 and international codes."
   -  name: postalcode
      description: "Postal code; string to handle Zip+4 and international codes."
   -  name: referenced
      description: "Whether or not this entity is Referenced."
      tests:
      -  not_null:
            name: gwpc_pc_address_referenced_not_null
            config:
               severity: warn
   -  name: subtype
      description: "Identifies a particular subtype within a supertype table; each subtype of a supertype has its own unique subtype value"
      tests:
      -  not_null:
            name: gwpc_pc_address_subtype_not_null
            config:
               severity: warn
   -  name: linkedaddress
      description: "A potential link to a group of addresses"
   -  name: description
      description: "Additional description of mailing address."
   -  name: temporarylastupdatetime
      description: "Temporary date and time of last update; will eventually be copied to the LastUpdateTime during commit"
   -  name: nonspecific
      description: "Is a non-specific location."
   -  name: obfuscatedinternal
      description: ""
      tests:
      -  not_null:
            name: gwpc_pc_address_obfuscatedinternal_not_null
            config:
               severity: warn
   -  name: archivepartition
      description: ""
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

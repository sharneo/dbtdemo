version: 2
models:
-  name: cc_policy
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: groupnumber_icare
      description: "Group number for policies that are part of a group"
   -  name: policysuffix
      description: "Indicates each unique period that a policy has been in effect.  (Sometimes called Mod or Module.)"
   -  name: acn_icare
      description: "Australian Company number"
   -  name: policyid_icare
      description: "PolicyCenter Public ID of the Policy"
   -  name: totalvehicles
      description: "Total number of vehicles on the master version of the policy."
   -  name: otherinsinfo
      description: "Notes about the insureds other insurance."
   -  name: insuredsiccode
      description: "The insureds SIC code (for workers comp policies only)."
   -  name: currency
      description: "The Currency of the policy. When set, the new value is also propagated to Claim.Currency."
      tests:
      -  not_null:
            name: gwcc_cc_policy_currency_not_null
            config:
               severity: warn
   -  name: totalbtp_icare
      description: "Total Base Tariff Premium on the policy"
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_policy_updatetime_not_null
            config:
               severity: warn
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_policy_id_not_null
            config:
               severity: warn
   -  name: assignedrisk
      description: "The policy is an Assigned risk from the state or not."
   -  name: financialinterests
      description: "Other financial interests of note."
   -  name: createuserid
      description: "User who created the object"
   -  name: returntoworkprgm
      description: "Return to work program (for workers comp policies only)."
   -  name: itcpercentagepel
      description: ""
      tests:
      -  not_null:
            name: gwcc_cc_policy_itcpercentagepel_not_null
            config:
               severity: warn
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_policy_retired_not_null
            config:
               severity: warn
   -  name: validationlevel
      description: "Validation level that this object passed (if any) before it was stored."
   -  name: coverageform
      description: "Policys coverage form."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: cancellationdate
      description: "Date on which the policy was canceled."
   -  name: origeffectivedate
      description: "First effective date on which the policyholder had coverage."
   -  name: accountnumber
      description: "Account number that this Policy belongs to."
   -  name: businessdescription_icare
      description: "Describes the nature of the business and operations"
   -  name: foreigncoverage
      description: "Whether the insured has foreign coverage."
   -  name: businessgstregistration_icare
      description: "Indicates if the business is registered for GST"
   -  name: legacypolicynumber_icare
      description: ""
   -  name: notes
      description: "Other notes on the policy."
   -  name: participation
      description: "Participation percentage (for commercial policies only)."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_policy_publicid_not_null
            config:
               severity: warn
   -  name: wcotherstates
      description: "Other states in which coverage applies (for workers comp policies only)."
   -  name: verified
      description: "True if no non-internal fields have been changed since this policy was retrieved from external system."
      tests:
      -  not_null:
            name: gwcc_cc_policy_verified_not_null
            config:
               severity: warn
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_policy_createtime_not_null
            config:
               severity: warn
   -  name: policyperiodid_icare
      description: "Policy Period Public ID of the Policy Period in PolicyCenter"
   -  name: otherinsurance
      description: "Whether the insured has other insurance."
   -  name: policysource
      description: "Source of the policy information."
   -  name: wcstates
      description: "States in which coverage applies (for workers comp policies only)."
   -  name: labourhire_icare
      description: "Flag to indicate the company is a labour hire firm"
   -  name: businessorganisationtype_icare
      description: "Business entity type"
   -  name: retroactivedate
      description: "Retroactive date for policies with retroactive coverage (for commercial policies only)."
   -  name: effectivedate
      description: "Date on which the policy is effective."
   -  name: producername_icare
      description: ""
   -  name: reportingdate
      description: "Extended reporting date for policies with extended coverage (for commercial policies only)."
   -  name: expirationdate
      description: "Date on which the policy expires."
   -  name: businessyearstarted_icare
      description: "Year the business was established"
   -  name: policytype_icare
      description: ""
      tests:
      -  not_null:
            name: gwcc_cc_policy_policytype_icare_not_null
            config:
               severity: warn
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: policytype
      description: "Type of policy."
      tests:
      -  not_null:
            name: gwcc_cc_policy_policytype_not_null
            config:
               severity: warn
   -  name: underwritingco
      description: "Underwriting company."
   -  name: status
      description: "Status of the policy."
   -  name: employercategory_icare
      description: "Identifies the category of the employer as per the Insurance Premiums Order."
   -  name: totalproperties
      description: "Total number of properties on the master version of the policy."
   -  name: policyratingplan
      description: "Policys rating plan (for workers comp policies only)."
   -  name: customerservicetier
      description: "Service tier behind this policy"
   -  name: manualverify_icare
      description: ""
      tests:
      -  not_null:
            name: gwcc_cc_policy_manualverify_icare_not_null
            config:
               severity: warn
   -  name: policynumber
      description: "Number of the policy (generally a string)."
      tests:
      -  not_null:
            name: gwcc_cc_policy_policynumber_not_null
            config:
               severity: warn
   -  name: underwritinggroup
      description: "Underwriting group."
   -  name: policysystemperiodid
      description: "The id of an associated external policy system period."
   -  name: producercode
      description: "Agency that sold the policy."
   -  name: tariffrate_icare
      description: ""
   -  name: specialistcsp_extid
      description: ""
   -  name: generalistcsp_extid
      description: ""
   -  name: tmfcostcentrerequiredflag_ext
      description: ""
   -  name: agencycode_ext
      description: ""
   -  name: offering_ext
      description: ""
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name

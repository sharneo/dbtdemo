      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_exposure_updatetime_not_null
            config:
               severity: warn
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_exposure_id_not_null
            config:
               severity: warn

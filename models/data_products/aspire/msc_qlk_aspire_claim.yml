version: 2

models:
  - name: msc_qlk_aspire_claim
    description: "Core claim facts for ASPIRE claims reporting"
    columns:
      - name: claim_sk
        description: "Surrogate key for claim"
        tests:
          - not_null
          - unique
      - name: source_system
        description: "Source system code"
        tests:
          - not_null
          - accepted_values:
              values: ['GWCC']
      - name: managing_entity_id
        description: "Managing entity ID"
      - name: managing_entity_sk
        description: "Managing entity surrogate key"
      - name: managing_entity_cd
        description: "Managing entity code"
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
      - name: src_claim_id
        description: "Source claim ID"
        tests:
          - not_null
      - name: policy_nbr
        description: "Policy number"
      - name: common_law_ind
        description: "Common law indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: incident_only_ind
        description: "Incident only indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: lost_time_ind
        description: "Lost time indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: medical_attention_ind
        description: "Medical attention indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: verified_policy_ind
        description: "Verified policy indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: claim_fatality_ind
        description: "Claim fatality indicator"
        tests:
          - accepted_values:
              values: ['Y']
      - name: claim_migrated_ind
        description: "Claim migrated indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: claim_reimbursement_sched_ind
        description: "Claim reimbursement schedule indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: covid_ind
        description: "COVID indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: conflict_of_interest_ind
        description: "Conflict of interest indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: extract_date
        description: "Extract date"
        tests:
          - not_null
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

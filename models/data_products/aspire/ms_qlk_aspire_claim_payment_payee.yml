version: 2

models:
  - name: ms_qlk_aspire_claim_payment_payee
    description: "Payee details for claim payments including TFN, age banding, contact restrictions, and bank details"
    columns:
      - name: claim_sk
        description: "Surrogate key for the claim"
        tests:
          - not_null
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
      - name: src_claim_id
        description: "Source system claim ID"
        tests:
          - not_null
      - name: claim_payment_sk
        description: "Surrogate key for the payment"
        tests:
          - not_null
      - name: contact_prohibited_ind
        description: "Indicates if contact with payee is prohibited"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: bank_details_present_ind
        description: "Indicates if bank details are on file"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: age_18_and_over_ind
        description: "Indicates if payee is 18 or older"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

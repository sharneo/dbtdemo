      - name: hsl11
        description: Amount in Local Currency (Period 11). Total for period 11 in company code currency.
      - name: hsl12
        description: Amount in Local Currency (Period 12). Total for period 12 in company code currency.
      - name: hsl13
        description: Amount in Local Currency (Period 13). Total for period 13 in company code currency.
      - name: hsl14

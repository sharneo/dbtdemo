version: 2
models:
-  name: cc_eftdata
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_eftdata_publicid_not_null
            config:
               severity: warn
   -  name: bankname
      description: "The name of the bank"
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_eftdata_createtime_not_null
            config:
               severity: warn
   -  name: bankroutingnumber
      description: "The routing number is a nine digit bank code used in the United States"
   -  name: addressbookuid
      description: "The system uses this value when it is integrated with ContactManager and the related contact is linked.  In this case, the ID represents the ID of the corresponding entity in ContactManager. This value is null if the object is not linked."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_eftdata_updatetime_not_null
            config:
               severity: warn
   -  name: isprimary
      description: "Indicates if this is the primary EFT record for the contact"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_eftdata_id_not_null
            config:
               severity: warn
   -  name: westpacfail_icare
      description: "This is a flag to track failed notification of EFT payments from Westpac"
   -  name: externallinkid
      description: "The external link ID suggested by CC to CM when linkID is null but has been created in CC. "
   -  name: createuserid
      description: "User who created the object"
   -  name: bankbranchname_icare
      description: ""
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_eftdata_retired_not_null
            config:
               severity: warn
   -  name: bankaccounttype
      description: "The type of bank accout e.g. checking, savings etc"
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: banktype_icare
      description: ""
   -  name: approved_icare
      description: ""
   -  name: accountname
      description: "The name on the account"
   -  name: bankaccountnumber
      description: "The bank account number"
   -  name: contactid
      description: "Contact this EFT record relates to"
      tests:
      -  not_null:
            name: gwcc_cc_eftdata_contactid_not_null
            config:
               severity: warn
   -  name: bankswiftcode_icare
      description: ""
   -  name: eftsource_ext
      description: ""
   -  name: isedited_ext
      description: ""
   -  name: timestamp_ext
      description: ""
   -  name: providerrefid_ext
      description: ""
   -  name: document_extid
      description: ""
   -  name: legacycreatetime_ext
      description: ""
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

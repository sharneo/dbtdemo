version: 2
models:
-  name: int_claim_cost_centre
   description: "Integrated claim cost centre model sourced from Guidewire CC. Maps claims to cost centres with number, name, and other name details. Original SAS source: 36_CLAIM_COST_CENTRE.sas (TBL_NM: MSC_QLK_ASPIRE_CLAIM_COST_CENTRE)"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber)"
      tests:
      -  not_null:
            name: int_claim_cost_centre_claim_sk_not_null
            config:
               severity: warn
   -  name: src_system_cd
      description: "Source system code"
   -  name: src_claim_id
      description: "Source claim ID - primary key"
      tests:
      -  unique:
            name: int_claim_cost_centre_src_claim_id_unique
            config:
               severity: warn
      -  not_null:
            name: int_claim_cost_centre_src_claim_id_not_null
            config:
               severity: warn
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_claim_cost_centre_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_claim_cost_centre_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: cost_centre_number
      description: "Cost centre number"
   -  name: cost_centre_name
      description: "Cost centre name"
   -  name: cost_centre_othername
      description: "Cost centre other name"
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_claim_cost_centre_file_ingestion_timestamp_not_null
            config:
               severity: warn

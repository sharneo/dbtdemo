version: 2

snapshots:
  - name: int_policy_ni_snapshost
    description: "This model contains one row for each policy."
    columns:
      - name: policy_sk
        description: "Policy Surrogate key"
        data_tests:
          - unique:
              config:
                severity: warn
                warn_if: ">1000"
      - name: policy_bk
        description: "Business key (policy number)"
      - name: source_system
        description: "Source system code (e.g. GWPC, Legacy)"
        data_tests:
          - not_null
      - name: product_code
        description: "Product code"
        data_tests:
          - not_null
      - name: current_status_code
        description: "Policy status (e.g. ACTIVE, LAPSED)"
        data_tests:
          - not_null
      - name: created_ts
        description: "First seen / created timestamp"
        data_tests:
          - not_null
      - name: updated_ts
        description: "Last updated timestamp"
        data_tests:
          - not_null
      - name: effective_from_ts
        description: "Start of record validity"
        data_tests:
          - not_null
      - name: effective_to_ts
        description: "End of validity; max date if current"
        data_tests:
          - not_null

version: 2
models:
-  name: stg_ccx_theplanservices_icare
   description: "Incremental staging model for Guidewire Claim Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: createuserid
      description: "User who created the object"
   -  name: servicecost
      description: ""
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_ccx_theplanservices_icare_publicid_not_null
            config:
               severity: warn
   -  name: servicestatus
      description: ""
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_ccx_theplanservices_icare_createtime_not_null
            config:
               severity: warn
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_ccx_theplanservices_icare_retired_not_null
            config:
               severity: warn
   -  name: totalamtrequested
      description: "Total amount requested for the service plan"
   -  name: documentlinkableid
      description: "This entity fk is designed to make other claim center entities linkable to documents."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: servicetype
      description: ""
   -  name: outcome
      description: "Outcome and any specific follow up actions required"
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_ccx_theplanservices_icare_updatetime_not_null
            config:
               severity: warn
   -  name: servreqlinkableid
      description: "This entity fk is designed to make other claim center entities linkable to ServiceRequest."
   -  name: expectedoutcome
      description: "What the case manager hopes to acheive"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_ccx_theplanservices_icare_id_not_null
            config:
               severity: warn
   -  name: keyrecommendations
      description: ""
   -  name: claim
      description: ""
   -  name: medtreatlinkableid
      description: "This entity fk is designed to make other claim center entities linkable to Medical Treatment."
   -  name: datecompleted
      description: "Date the Service plan flagged as complete"
   -  name: purpose
      description: "purpose of selected service plan"
   -  name: legacycreatetime
      description: ""
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

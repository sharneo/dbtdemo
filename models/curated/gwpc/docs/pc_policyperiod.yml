version: 2
models:
- name: pc_policyperiod
  columns:
  - name: validquote
    description: "Whether or not the policys pricing information is up to date and\
      \ accurate. This can be derived from the PolicyPeriod status and Job type, which\
      \ is being used as part of the entity rules for Foundation"
    data_tests:
    - not_null:
        name: gwpc_pc_policyperiod_validquote_not_null
        config:
          severity: warn

  - name: locked
    description: ""
    data_tests:
    - not_null:

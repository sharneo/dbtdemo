version: 2
models:
-  name: int_claim_screen_action
   description: "Integrated claim screen action model sourced from Guidewire CC. Tracks claim screening actions with dates and ranking. Original SAS source: 34_CLAIM_SCREEN_ACTION.sas (TBL_NM: MSC_QLK_ASPIRE_CLAIM_SCREEN_ACTION)"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber)"
      tests:
      -  not_null:
            name: int_claim_screen_action_claim_sk_not_null
            config:
               severity: warn
   -  name: source_system
      description: "Source system identifier"
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_claim_screen_action_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_claim_screen_action_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: src_claim_id
      description: "Source claim ID"
      tests:
      -  not_null:
            name: int_claim_screen_action_src_claim_id_not_null
            config:
               severity: warn
   -  name: src_claim_screen_action_id
      description: "Source claim screen action ID - primary key"
      tests:
      -  unique:
            name: int_claim_screen_action_src_id_unique
            config:
               severity: warn
      -  not_null:
            name: int_claim_screen_action_src_id_not_null
            config:
               severity: warn
   -  name: claim_public_id
      description: "Claim public ID"
   -  name: claim_screen_action_cd
      description: "Claim screen action code"
   -  name: claim_screen_action_desc
      description: "Claim screen action description"
   -  name: claim_screen_action_dttm
      description: "Claim screen action datetime"
   -  name: claim_screen_action_dt
      description: "Claim screen action date"
   -  name: src_create_dttm
      description: "Source system creation timestamp"
      tests:
      -  not_null:
            name: int_claim_screen_action_src_create_dttm_not_null
            config:
               severity: warn
   -  name: src_create_dt
      description: "Source system creation date"
   -  name: screen_action_create_user_sk
      description: "Surrogate key for the user who created the screen action"
   -  name: latest_screen_action_rank
      description: "Latest screen action rank"
   -  name: earliest_screen_action_rank
      description: "Earliest screen action rank"
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_claim_screen_action_file_ingestion_timestamp_not_null
            config:
               severity: warn

version: 2
snapshots:
-  name: cc_groupuser
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_groupuser_publicid_not_null
            config:
               severity: warn
   -  name: textfield1
      description: "General-purpose text field."
   -  name: textfield2
      description: "General-purpose text field."
   -  name: textfield3
      description: "General-purpose text field."
   -  name: userid
      description: "The associated user."
      tests:
      -  not_null:
            name: gwcc_cc_groupuser_userid_not_null
            config:
               severity: warn
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: manager
      description: "Flag indicating whether the user has permission to see activity within the group."
      tests:
      -  not_null:
            name: gwcc_cc_groupuser_manager_not_null
            config:
               severity: warn
   -  name: loadfactortype
      description: "Type of load factor privileges the user has."
   -  name: loadfactor
      description: "Percentage value of normal workload to be given to this user in this group. This is used for round-robin assignment."
   -  name: member
      description: "Flag indicating whether the user is a working member of the group (for purposes of work assignment, for example), as opposed to simply being associated with the group as a manager or other auxiliary person."
      tests:
      -  not_null:
            name: gwcc_cc_groupuser_member_not_null
            config:
               severity: warn
   -  name: groupid
      description: "The associated group."
      tests:
      -  not_null:
            name: gwcc_cc_groupuser_groupid_not_null
            config:
               severity: warn
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_groupuser_id_not_null
            config:
               severity: warn
   -  name: groupuserworkloadid
      description: "Assigned workload information for this group user"

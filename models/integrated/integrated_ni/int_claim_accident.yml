version: 2
models:
-  name: int_claim_accident
   description: "Integrated claim accident model sourced from Guidewire CC. Contains accident location, mechanism of injury, recovery investigation, and policy location details. Original SAS source: 01_ACCIDENT.sas (TBL_NM: MSC_QLK_ASPIRE_ACCIDENT)"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber) - primary key"
      tests:
      -  unique:
            name: int_claim_accident_claim_sk_unique
            config:
               severity: warn
      -  not_null:
            name: int_claim_accident_claim_sk_not_null
            config:
               severity: warn
   -  name: source_system
      description: "Source system identifier"
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_claim_accident_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_claim_accident_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: recovery_investigation_ind
      description: "Recovery investigation indicator (Y/N)"
   -  name: policy_location_addr
      description: "Policy location address"
   -  name: toocs_mechanism_of_injury_desc
      description: "TOOCS mechanism of injury description"
   -  name: accident_location_type_cd
      description: "Accident location type code"
   -  name: accident_location_type_desc
      description: "Accident location type description"
   -  name: src_updated_dttm
      description: "Source updated datetime"
   -  name: src_updated_dt
      description: "Source updated date"
   -  name: severity
      description: "Incident severity"
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_claim_accident_file_ingestion_timestamp_not_null
            config:
               severity: warn

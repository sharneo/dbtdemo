version: 2
models:
-  name: cc_activity
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: previousgroupid
      description: "Group to which this entity was previously assigned."
   -  name: enddate
      description: "Time the event is scheduled to terminate or null if the activity is not a scheduled event."
   -  name: assignedbyuserid
      description: "User who assigned this entity."
   -  name: externallyowned
      description: "Whether the activity is externally owned."
      tests:
      -  not_null:
            name: gwcc_cc_activity_externallyowned_not_null
            config:
               severity: warn
   -  name: logicalname
      description: "Logical name of the activity.  Used by the internal workflow engine."
   -  name: approvalrationale
      description: "Rationale for approving/rejecting the activity. This field should only be set for approval activities."
   -  name: previousqueueid
      description: "Queue to which this entity was previously assigned."
   -  name: documenttemplate
      description: "The id of an associated document template. The id and language gets passed to IDocumentTemplateSource to retrieve the DocumentTemplateDescriptor. This property should not be used by applications."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_activity_updatetime_not_null
            config:
               severity: warn
   -  name: emailtemplate
      description: "The id of an associated email template. The id gets passed to IEmailTemplateSource to retrieve the EmailTemplateDescriptor."
   -  name: workflowid
      description: "Optional pointer to the workflow this activity is associated with."
   -  name: dispute_icareid
      description: "Associated dispute"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_activity_id_not_null
            config:
               severity: warn
   -  name: matterid
      description: "Matter with which this activity is associated."
   -  name: closeuserid
      description: "The user who closed this activity."
   -  name: wpiassessrecord_icare
      description: "Associated WPI Assess Record"
   -  name: workcapacity_icareid
      description: "Associated work capacity decision."
   -  name: createuserid
      description: "User who created the object"
   -  name: priority
      description: "Priority of the activity with respect to other activities."
      tests:
      -  not_null:
            name: gwcc_cc_activity_priority_not_null
            config:
               severity: warn
   -  name: closedate
      description: "Date and time when this entity was closed. (Not applicable to all assignable entities)"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_activity_retired_not_null
            config:
               severity: warn
   -  name: validationlevel
      description: "Validation level that this object passed (if any) before it was stored."
   -  name: subject
      description: "A brief title for the activity; this is associated with its pattern."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: shortsubject
      description: "A very brief title for the activity e.g., displayable in a calendar; this is associated with its pattern."
   -  name: bulkinvoiceid
      description: "The associated bulk invoice, if there is one. This field should be set only for ApprovalActivities and ApprovalDeniedActivities for BulkInvoices."
   -  name: approved
      description: "Whether the activity is approved. This is null if not relevant or undecided."
   -  name: type
      description: "Type of the activity."
      tests:
      -  not_null:
            name: gwcc_cc_activity_type_not_null
            config:
               severity: warn
   -  name: targetdate
      description: "If this activity is a task, time by which a person should complete the task; if not completed by this time, the task is considered overdue. If this activity is an event, the time the event is scheduled to start."
   -  name: autogenerated
      description: "True if the activity was generated automatically; never fully implemented. Instead, customers can create an extension field and set it after creating an activity in a rule to indicate how the activity was created"
      tests:
      -  not_null:
            name: gwcc_cc_activity_autogenerated_not_null
            config:
               severity: warn
   -  name: escalationdate
      description: "When the activity will be escalated if it isnt yet completed; this is null if the activity is never escalated."
   -  name: externalownerccid
      description: "External owner of this activity."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_activity_publicid_not_null
            config:
               severity: warn
   -  name: lastvieweddate
      description: "When this activity was last viewed by the assignee. If never viewed, this is null."
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_activity_createtime_not_null
            config:
               severity: warn
   -  name: activityclass
      description: "The class of the activity."
      tests:
      -  not_null:
            name: gwcc_cc_activity_activityclass_not_null
            config:
               severity: warn
   -  name: command
      description: "A Gosu command to execute for this activity."
   -  name: assignedgroupid
      description: "Group to which this entity is assigned; null if none assigned"
   -  name: ocrinvoice
      description: "A Failed OCR Invoice"
   -  name: servicerequestid
      description: "ServiceRequest with which this activity is associated."
   -  name: claimid
      description: "Claim with which this activity is associated."
      tests:
      -  not_null:
            name: gwcc_cc_activity_claimid_not_null
            config:
               severity: warn
   -  name: reminderactivity_icareid
      description: "Link to reminder activity"
   -  name: mandatory
      description: "True if the activity must be completed and cannot be skipped."
      tests:
      -  not_null:
            name: gwcc_cc_activity_mandatory_not_null
            config:
               severity: warn
   -  name: rehabplanid_ext
      description: ""
   -  name: previoususerid
      description: "User to which this entity was previously assigned."
   -  name: recurring
      description: "Whether this activity is recurring."
      tests:
      -  not_null:
            name: gwcc_cc_activity_recurring_not_null
            config:
               severity: warn
   -  name: assignedqueueid
      description: "Either the Queue to which this entity is assigned (if AssignmentStatus is assigned), the Queue to which the system suggests assignment (if AssignmentStatus is manual), or null if none assigned. Only one of AssignedUserID or AssignedQueueID should be non null."
   -  name: transactionsetid
      description: "The associated transaction set, if there is one. This field should be set only for ApprovalActivities and ApprovalDeniedActivities for TransactionSets."
   -  name: exposureid
      description: "Exposure with which this activity is associated."
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: escalated
      description: "True if the activity has been escalated."
      tests:
      -  not_null:
            name: gwcc_cc_activity_escalated_not_null
            config:
               severity: warn
   -  name: status
      description: "Status of the activity."
      tests:
      -  not_null:
            name: gwcc_cc_activity_status_not_null
            config:
               severity: warn
   -  name: importance
      description: "The importance level of this activity."
   -  name: assigneduserid
      description: "Either the User to which this entity is assigned (if AssignmentStatus is assigned), the User to which the system suggests assignment (if AssignmentStatus is manual), or null if none assigned. Only one of AssignedUserID or AssignedQueueID should be non null."
   -  name: approvalissue
      description: "Reason approval is needed. This field should only be set for approval activities."
   -  name: subtype
      description: "Identifies a particular subtype within a supertype table; each subtype of a supertype has its own unique subtype value"
      tests:
      -  not_null:
            name: gwcc_cc_activity_subtype_not_null
            config:
               severity: warn
   -  name: assignmentdate
      description: "Time when entity last assigned"
   -  name: activitypatternid
      description: "Pattern that created this activity. It it was not created from a pattern, then this is null."
   -  name: description
      description: "Description of the activity."
   -  name: assignmentstatus
      description: "Typelist describing assignment status."
      tests:
      -  not_null:
            name: gwcc_cc_activity_assignmentstatus_not_null
            config:
               severity: warn
   -  name: claimcontactid
      description: "Claimant with which this activity is associated."
   -  name: employmentcapacity_icareid
      description: ""
   -  name: referencedate_ext
      description: ""
   -  name: mspreferral_extid
      description: ""
   -  name: recurrenceenddate_ext
      description: ""
   -  name: recurrencestartdate_ext
      description: ""
   -  name: isrecurring_ext
      description: ""
   -  name: recurringfrequency_ext
      description: ""
   -  name: wpiactpeerreview_extid
      description: ""
   -  name: customstatus_ext
      description: ""
   -  name: withdrawreason_ext
      description: ""
   -  name: approvalstatus_ext
      description: ""
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

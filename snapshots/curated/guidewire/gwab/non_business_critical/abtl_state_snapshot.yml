snapshots:
  - name: abtl_state_snapshot
    relation: ref('stg_abtl_state')
    config:
      schema: GWAB
      unique_key: state_sk
      alias: abtl_state
      strategy: check
      updated_at: updated_at
      check_cols: ["hash_key"]
      hard_deletes: new_record
      tags: ["layer:curated","model:snapshot","module:gwab","domain:contact_manager", "criticality:non_business_critical", "entity:abtl_state"]
      snapshot_meta_column_names:
        dbt_valid_from: dbt_valid_from
        dbt_valid_to: dbt_valid_to
        dbt_scd_id: scd_id
        dbt_updated_at: modified_date
        dbt_is_deleted: is_deleted

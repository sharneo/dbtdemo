  - name: editeffectivedate
    description: "Dates edits are effective. This has been configured in GW to always\
      \ be the same as the Policy Period Start Date. This is an icare business rule\
      \ such that any revisions on the PolicyPeriod are always attributed back within\
      \ the Policy term. Note that the only scenario where this isnt the same is on\
      \ Cancellation, where the EditEffectiveDate = CancellationDate; or on Reinstatement\
      \ where the EditEffectiveDate = Job.CloseDate. The EditEffectiveDate is the\
      \ date chosen by the user when they want the event to take place. A Cancellation\
      \ job.CloseDate may differ to the CancellationDate or EditEffectiveDate if the\
      \ date of cancellation is to occur on a specific date rather than now. The job\
      \ closes with the date scheduled. "
    data_tests:
    - not_null:
        name: gwpc_pc_policyperiod_editeffectivedate_not_null
        config:
          severity: warn


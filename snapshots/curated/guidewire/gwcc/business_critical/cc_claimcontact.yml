version: 2
snapshots:
-  name: cc_claimcontact
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: personfirstnamedenorm
      description: "denormalization of person first name, to speed up search for claim by person name"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_claimcontact_publicid_not_null
            config:
               severity: warn
   -  name: contactvalidfrom
      description: "Start Date when this Contact is valid on this claim "
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_claimcontact_createtime_not_null
            config:
               severity: warn
   -  name: policyid
      description: "Policy with which the contact is associated."
   -  name: benefitenddate
      description: "Benefit end date"
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_claimcontact_updatetime_not_null
            config:
               severity: warn
   -  name: contactvalidto
      description: "Date when this Contact is no longer valid on this claim"
   -  name: claimantflag
      description: "Denorm field indicating whether or not this ClaimContact has the role of claimant."
   -  name: claimid
      description: "Claim with which the contact is associated."
      tests:
      -  not_null:
            name: gwcc_cc_claimcontact_claimid_not_null
            config:
               severity: warn
   -  name: id
      description: "Internally managed primary key"

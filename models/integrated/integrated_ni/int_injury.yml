version: 2

models:
  - name: int_injury
    description: >
      Integrated injury/incident model sourced from GuidewireCC.
      Contains detailed injury information per incident including TOOCS codes,
      ICD diagnosis, mechanism/nature/agency of injury, fatality details,
      and mental stress classification based on ICD code ranges.
      Original SAS source: 19_INJURY.sas (TBL_NM: MSC_QLK_ASPIRE_INJURY)
    columns:
      - name: loss_sk
        description: Surrogate key for the loss/incident (MD5 hash of source_system + incident public ID)
      - name: claim_sk
        description: Surrogate key for the claim (MD5 hash of source_system + claim number)
      - name: claim_nbr
        description: Claim number from GuidewireCC
      - name: src_incident_id
        description: Source incident ID from CC_INCIDENT
      - name: src_claim_id
        description: Source claim ID (foreign key to CC_CLAIM)
      - name: injury_desc
        description: Free-text description of the injury
      - name: multiple_injuries_ind
        description: Y/N indicator whether the incident involves multiple injuries
      - name: primary_claimable_incident_ind
        description: Y/N indicator whether this is the primary claimable incident
      - name: incident_type_cd
        description: Incident type code (e.g. injuryincident)
      - name: incident_type_desc
        description: Incident type description
      - name: deceased_dt
        description: Date of death if applicable
      - name: significant_injury_dt
        description: Date the injury was deemed significant
      - name: contact_complete_dt
        description: Date initial contact was completed
      - name: fatality_notification_dt
        description: Date fatality was notified
      - name: fatality_result_of_self_harm_ind
        description: Indicator whether fatality resulted from self-harm
      - name: fatality_liability_decision_dt
        description: Date of fatality liability decision
      - name: odg_rtw_dt
        description: ODG (Official Disability Guidelines) return-to-work date
      - name: odg_rtw_day_cnt
        description: ODG return-to-work duration in days
      - name: breakdown_agency_cd
        description: TOOCS breakdown agency code
      - name: breakdown_agency_desc
        description: TOOCS breakdown agency description
      - name: nature_of_injury_cd
        description: TOOCS nature of injury code
      - name: nature_of_injury_desc
        description: TOOCS nature of injury description
      - name: mechanism_of_injury_cd
        description: TOOCS mechanism of injury code
      - name: mechanism_of_injury_desc
        description: TOOCS mechanism of injury description
      - name: agency_of_injury_cd
        description: TOOCS agency of injury code
      - name: agency_of_injury_desc
        description: TOOCS agency of injury description
      - name: location_of_injury_cd
        description: TOOCS body location of injury code
      - name: location_of_injury_desc
        description: TOOCS body location of injury description
      - name: claimant_duty_status_cd
        description: Claimant duty status code at time of injury
      - name: claimant_duty_status_desc
        description: Claimant duty status description
      - name: result_of_injury_cd
        description: Severity/result of injury code
      - name: result_of_injury_desc
        description: Severity/result of injury description
      - name: fatality_liability_decision_s1
        description: Fatality liability decision status code
      - name: fatality_liability_decision_s2
        description: Fatality liability decision status description
      - name: icd_cd
        description: Primary ICD diagnosis code
      - name: icd_desc
        description: Primary ICD diagnosis description
      - name: mental_stress_ind
        description: >
          Y/N indicator derived from ICD code. Y if code starts with F
          and numeric portion is between 01-59 or equals 99 (mental health range).
      - name: src_create_dttm
        description: Source system creation timestamp
      - name: src_create_dt
        description: Source system creation date
      - name: src_eff_dttm
        description: Source system effective/update timestamp
      - name: src_eff_dt
        description: Source system effective/update date
      - name: extract_date
        description: Date of data extraction
      - name: file_ingestion_timestamp
        description: Timestamp of file ingestion, used as incremental filter

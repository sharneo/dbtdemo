version: 2

snapshots:
  - name: supplier_snapshot
    description: |
      SCD Type 2 history of SAP Supplier Master data (LFA1).
      Grain: one row per version of each supplier.
      Stores supplier general data including address, contact details, account group, and tax information.
    columns:
      - name: supplier_sk
        description: Surrogate key for this supplier record, generated from [lifnr]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: lifnr
        description: Supplier Account Number (SAP LIFNR). Unique identifier for the supplier master record.

      - name: land1
        description: Country Key (SAP LAND1). Country of the supplier's primary address.

      - name: name1
        description: Supplier Name (Line 1). Primary name of the supplier.

      - name: name2
        description: Supplier Name (Line 2). Secondary name or additional address line.

      - name: name3
        description: Supplier Name (Line 3). Third address line for the supplier.

      - name: name4
        description: Supplier Name (Line 4). Fourth address line for the supplier.

      - name: ort01
        description: City (SAP ORT01). City of the supplier's primary address.

      - name: pstlz
        description: Postal Code (SAP PSTLZ). Postal code of the supplier's address.

      - name: regio
        description: Region / State (SAP REGIO). State or province of the supplier's address.

      - name: sortl
        description: Sort Field (SAP SORTL). Search term for the supplier master.

      - name: stras
        description: Street Address (SAP STRAS). Street name and number of the supplier's address.

      - name: ktokk
        description: Supplier Account Group (SAP KTOKK). Groups suppliers for master data configuration and reporting.

      - name: telf1
        description: Telephone Number (SAP TELF1). Primary telephone number for the supplier.

      - name: telf2
        description: Second Telephone Number. Secondary telephone number.

      - name: telfx
        description: Fax Number. Fax number for the supplier.

      - name: vbund
        description: Trading Partner (SAP VBUND). Company ID for intercompany supplier relationships.

      - name: stceg
        description: VAT Registration Number (SAP STCEG). Tax registration number for the supplier.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

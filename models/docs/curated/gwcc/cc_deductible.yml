version: 2
models:
-  name: cc_deductible
   columns:
   -  name: createuserid
      description: "User who created the object"
   -  name: coverageid
      description: "The coverage, if any, whose deductible this entity represents."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_deductible_publicid_not_null
            config:
               severity: warn
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_deductible_createtime_not_null
            config:
               severity: warn
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_deductible_retired_not_null
            config:
               severity: warn
   -  name: paid
      description: "Specifies whether this deductible has been paid."
   -  name: editreason
      description: "Reason for editing (override or waive) the deductible."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: currency
      description: ""
      tests:
      -  not_null:
            name: gwcc_cc_deductible_currency_not_null
            config:
               severity: warn
   -  name: invoicenumber_icare
      description: ""
   -  name: accountnumber_icare
      description: ""
   -  name: overridden
      description: "Specifies whether this deductible has been overriden."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_deductible_updatetime_not_null
            config:
               severity: warn
   -  name: waived
      description: "Specifies whether this deductible has been waived."
   -  name: claimid
      description: "The claim on which this deductible was created."
      tests:
      -  not_null:
            name: gwcc_cc_deductible_claimid_not_null
            config:
               severity: warn
   -  name: amount
      description: "Deductible amount to be applied to a payment."
   -  name: invoiceamountsenttobc
      description: "Used to hold the amount sent to BC for invoicing. "
   -  name: id
      description: "Internally managed primary key"
      tests:

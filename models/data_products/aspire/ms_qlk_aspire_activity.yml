version: 2

models:
  - name: ms_qlk_aspire_activity
    description: "Activity records associated with claims including assignments, escalations, and closures"
    columns:
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
      - name: src_activity_id
        description: "Source system activity ID"
        tests:
          - not_null
          - unique
      - name: src_create_dttm
        description: "Source system creation datetime"
        tests:
          - not_null
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

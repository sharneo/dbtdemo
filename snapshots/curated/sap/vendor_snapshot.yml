version: 2

snapshots:
  - name: vendor_snapshot
    description: |
      SCD Type 2 history of SAP Vendor Master (LFA1 + LFB1).
      Grain: one row per version of each vendor at company code level.
      Stores vendor company-code-specific data including payment terms, reconciliation account, and payment methods.
    columns:
      - name: vendor_sk
        description: Surrogate key for this vendor record, generated from [lifnr, bukrs]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: lifnr
        description: Vendor Account Number (SAP LIFNR). Unique identifier for the vendor master.

      - name: bukrs
        description: Company Code (SAP BUKRS). Company code for this vendor's accounting view.

      - name: erdat
        description: Created On (SAP ERDAT). Date when the vendor master was created.

      - name: zuawa
        description: Key Word Sorting (SAP ZUAWA). Sorting criterion for account determination.

      - name: akont
        description: Reconciliation Account (SAP AKONT). G/L account used for automatic posting to vendor accounts.

      - name: zwels
        description: Payment Methods (SAP ZWELS). Allowed payment methods for this vendor.

      - name: zterm
        description: Terms of Payment (SAP ZTERM). Payment terms for this vendor.

      - name: zsabe
        description: Payee Code for Payment Method. Identifies the payee for electronic payments.

      - name: fdgrv
        description: Cash Management Group (SAP FDGRV). Grouping for cash management and forecasting.

      - name: intad
        description: Interest Calculation Indicator. Defines interest calculation method for overdue items.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

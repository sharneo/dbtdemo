version: 2
models:
-  name: int_claim_extract_eml
   description: "Integrated claim extract EML model sourced from Guidewire CC. Contains employer liability extract data for claims reporting. Original SAS source: EML extract"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber) - primary key"
      tests:
      -  unique:
            name: int_claim_extract_eml_claim_sk_unique
            config:
               severity: warn
      -  not_null:
            name: int_claim_extract_eml_claim_sk_not_null
            config:
               severity: warn
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_claim_extract_eml_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_claim_extract_eml_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_claim_extract_eml_file_ingestion_timestamp_not_null
            config:
               severity: warn

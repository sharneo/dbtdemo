version: 2

models:
  - name: msc_qlk_aspire_accident
    description: "Accident/incident details for ASPIRE claims reporting"
    columns:
      - name: claim_sk
        description: "Surrogate key for claim"
        tests:
          - not_null
          - unique
      - name: source_system
        description: "Source system code"
        tests:
          - not_null
      - name: src_claim_id
        description: "Source claim ID"
        tests:
          - not_null
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
      - name: recovery_investigation_ind
        description: "Indicates if recovery investigation exists"
      - name: policy_location_addr
        description: "Policy location address"
      - name: toocs_mechanism_if_injury_desc
        description: "TOOCS mechanism of injury description"
      - name: accident_location_type_cd
        description: "Accident location type code"
      - name: accident_location_type_desc
        description: "Accident location type description"
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

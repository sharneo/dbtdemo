version: 2
models:
-  name: cc_user
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: obfuscatedinternal
      description: "Flag to let us know if the bean has been obfuscated."
      tests:
      -  not_null:
            name: gwcc_cc_user_obfuscatedinternal_not_null
            config:
               severity: warn
   -  name: offsetstatsupdatetime
      description: ""
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_user_publicid_not_null
            config:
               severity: warn
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_user_createtime_not_null
            config:
               severity: warn
   -  name: usersettingsid
      description: "Settings for this user (formerly known as preferences)."
   -  name: spatialpointdenorm
      description: "Denormalized column from UserContact.PrimaryAddress.SpatialPoint"
   -  name: sessiontimeoutsecs
      description: "Users session timeout value in seconds"
   -  name: organizationid
      description: "Each user should belong to exactly one organization"

version: 2
models:
-  name: stg_ccx_wpiassessrecord_icare
   description: "Incremental staging model for Guidewire Claim Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_ccx_wpiassessrecord_icare_publicid_not_null
            config:
               severity: warn
   -  name: wpiresult_icare
      description: "Settled / agreed WPI percentage"
   -  name: wpiassessment_icareid
      description: "WPI Assessment"
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_ccx_wpiassessrecord_icare_createtime_not_null
            config:
               severity: warn
   -  name: documentlinkableid
      description: "This entity fk is designed to make other claim center entities linkable to documents."
   -  name: claimedbhlperventage_icare
      description: "BHL percentage claimed"
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_ccx_wpiassessrecord_icare_updatetime_not_null
            config:
               severity: warn
   -  name: wpiassessmentstate_icare
      description: "State of WPI assessment, it true it is closed, else it is open."
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_ccx_wpiassessrecord_icare_id_not_null
            config:
               severity: warn
   -  name: settlementtype_icare
      description: "Type of claim"
   -  name: offeredbhlpercentage_icare
      description: "BHL percentage offer made to worker"
   -  name: createuserid
      description: "User who created the object"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: archivepartition
      description: ""
   -  name: letterofofferdate_icare
      description: "Offer letter date"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_ccx_wpiassessrecord_icare_retired_not_null
            config:
               severity: warn
   -  name: medicare_icare
      description: "Medicare claim type for interest percentage"
   -  name: offeredwpipercentage_icare
      description: "WPI percentage offer made to worker"
   -  name: interest

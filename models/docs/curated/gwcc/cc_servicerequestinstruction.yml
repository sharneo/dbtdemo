version: 2
models:
-  name: cc_servicerequestinstruction
   columns:
   -  name: createuserid
      description: "User who created the object"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_servicerequestinstruction_publicid_not_null
            config:
               severity: warn
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_servicerequestinstruction_createtime_not_null
            config:
               severity: warn
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: servicerequestid
      description: "The service request for which the specialist is being instructed."
      tests:
      -  not_null:
            name: gwcc_cc_servicerequestinstruction_servicerequestid_not_null
            config:
               severity: warn
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_servicerequestinstruction_updatetime_not_null
            config:
               severity: warn
   -  name: serviceaddressid
      description: "The location at which the service is to be performed; may be null if the location is implied by the specialist, such as if it will be performed at the specialists place of business."
   -  name: instructiontext
      description: "Text instructions to be provided to the specialist."
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_servicerequestinstruction_id_not_null
            config:
               severity: warn
   -  name: customercontactid
      description: "The contact with whom the specialist should coordinate to perform the work. In many cases, this will be the claimant."
      tests:
      -  not_null:
            name: gwcc_cc_servicerequestinstruction_customercontactid_not_null
            config:
               severity: warn

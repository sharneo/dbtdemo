version: 2

snapshots:
  - name: fsv_snapshot
    description: |
      SCD Type 2 history of SAP Financial Statement Versions.
      Grain: one row per version of each financial statement version item.
      Defines the structure and grouping of G/L accounts for financial reporting (P&L, Balance Sheet).
    columns:
      - name: fsv_sk
        description: Surrogate key for this FSV record, generated from [versn, vonkt, biskt, id]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: versn
        description: Financial Statement Version (SAP VERSN). Identifies the reporting structure.

      - name: vonkt
        description: From Account Number (SAP VONKT). Start of the G/L account range for this item.

      - name: biskt
        description: To Account Number (SAP BISKT). End of the G/L account range for this item.

      - name: id
        description: Item identifier within the financial statement version.

      - name: vstxt
        description: Item description text for the financial statement item.

      - name: txt45
        description: Additional text for the financial statement item (45 characters).

      - name: ktopl
        description: Chart of Accounts (SAP KTOPL). Identifies the chart of accounts this version belongs to.

      - name: type
        description: Item type classification (e.g., heading, text, account group, subtotal).

      - name: parent
        description: Parent item identifier in the financial statement hierarchy.

      - name: child
        description: Child item identifier in the financial statement hierarchy.

      - name: nextn
        description: Next item identifier for sequencing within the hierarchy.

      - name: stufe
        description: Hierarchy level (SAP STUFE). Indicates the depth of this item in the hierarchy.

      - name: summe
        description: Summation level indicator. Defines how subtotals are calculated.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

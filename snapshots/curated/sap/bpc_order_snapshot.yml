version: 2

snapshots:
  - name: bpc_order_snapshot
    description: |
      SCD Type 2 history of BPC Order (Internal Order) dimension master data.
      Grain: one row per version of each BPC order dimension record.
      Source system: SAP BPC.
    columns:
      - name: bpc_order_sk
        description: Surrogate key for this BPC order record, generated from [sid]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: sid
        description: BPC internal surrogate identifier for the order dimension record.

      - name: b631_s_coorder
        description: Internal Order identifier from BPC dimension master data. Maps to SAP AUFNR.

      - name: chckfl
        description: Check flag indicator for BPC dimension data validation.

      - name: datafl
        description: Data flag indicator. Controls whether this dimension record is active for data processing.

      - name: incfl
        description: Include flag indicator. Controls whether this dimension record is included in consolidation processing.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

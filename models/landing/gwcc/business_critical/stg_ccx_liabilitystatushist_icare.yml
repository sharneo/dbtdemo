version: 2
models:
-  name: stg_ccx_liabilitystatushist_icare
   description: "Incremental staging model for Guidewire Claim Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: createuserid
      description: "User who created the object"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_ccx_liabilitystatushist_icare_publicid_not_null
            config:
               severity: warn
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: liabilitystatusdecisiondate
      description: "Date decision entered"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_ccx_liabilitystatushist_icare_retired_not_null
            config:
               severity: warn
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_ccx_liabilitystatushist_icare_createtime_not_null
            config:
               severity: warn
   -  name: liabilitystatusdate
      description: "Decision Effective Date"
   -  name: refid
      description: "Decision reference id"
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: weeklybenefitenddate
      description: "Actual cessation date for weekly benefits for provisional liability/liability denied/partial liability decisions"
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_ccx_liabilitystatushist_icare_updatetime_not_null
            config:
               severity: warn
   -  name: claimworkcompid
      description: "Workers Compensation Information related to a claim"
      tests:
      -  not_null:
            name: gwcc_ccx_liabilitystatushist_icare_claimworkcompid_not_null
            config:
               severity: warn
   -  name: noticeperiod
      description: "Notice period that applies from when the decision takes place and the decision takes effect"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_ccx_liabilitystatushist_icare_id_not_null
            config:
               severity: warn
   -  name: liabilitystatus
      description: "Liability Status"
   -  name: provisionalweeks
      description: "Number of weeks that Provisional liability is approved"
   -  name: ctmliabilitystatusdecisiondate
      description: ""
   -  name: medicalbenefitenddate
      description: ""
   -  name: postalrule
      description: ""

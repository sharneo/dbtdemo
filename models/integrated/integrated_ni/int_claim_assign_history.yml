version: 2
models:
-  name: int_claim_assign_history
   description: "Integrated claim assignment history model sourced from Guidewire CC. Tracks assignment changes over time including user/team transitions and migrated claim handling. Original SAS source: 57_CLAIM_ASSIGN_HISTORY.sas (TBL_NM: MSC_QLK_ASPIRE_CLAIM_ASSIGN_HISTORY)"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber) - primary key"
      tests:
      -  unique:
            name: int_claim_assign_history_claim_sk_unique
            config:
               severity: warn
      -  not_null:
            name: int_claim_assign_history_claim_sk_not_null
            config:
               severity: warn
   -  name: src_system_cd
      description: "Source system code"
   -  name: managing_entity_id
      description: "Managing entity ID"
   -  name: managing_entity_sk
      description: "Surrogate key for managing entity"
      tests:
      -  not_null:
            name: int_claim_assign_history_managing_entity_sk_not_null
            config:
               severity: warn
   -  name: managing_entity_cd
      description: "Managing entity code"
   -  name: src_claim_id
      description: "Source claim ID"
      tests:
      -  not_null:
            name: int_claim_assign_history_src_claim_id_not_null
            config:
               severity: warn
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_claim_assign_history_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_claim_assign_history_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: assign_dttm
      description: "Assignment datetime"
   -  name: assign_dt
      description: "Assignment date"
   -  name: next_assign_dt
      description: "Next assignment date"
   -  name: event_desc
      description: "Event description"
   -  name: matter_id
      description: "Matter ID"
   -  name: assign_user_name
      description: "Assigned user name"
   -  name: assign_team
      description: "Assigned team name"
   -  name: include_ind
      description: "Include indicator (0 or 1)"
   -  name: earliest_history_rank
      description: "Earliest history rank"
   -  name: latest_history_rank
      description: "Latest history rank"
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_claim_assign_history_file_ingestion_timestamp_not_null
            config:
               severity: warn

version: 2

models:
  - name: ms_qlk_aspire_claim_medical_treatment
    description: "Medical treatment records for claims including providers, costs, and approval status"
    columns:
      - name: claim_sk
        description: "Surrogate key for the claim"
        tests:
          - not_null
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
      - name: src_claim_id
        description: "Source system claim ID"
        tests:
          - not_null
      - name: treatment_public_id
        description: "Public identifier for the treatment record"
        tests:
          - not_null
          - unique
      - name: source_system
        description: "Source system code"
        tests:
          - not_null
          - accepted_values:
              values: ['GWCC']
      - name: include_on_imp_ind
        description: "Indicates if treatment should be included on impairment assessment"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

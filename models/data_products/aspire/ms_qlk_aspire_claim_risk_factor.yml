version: 2

models:
  - name: ms_qlk_aspire_claim_risk_factor
    description: "Claim risk factors for ASPIRE claims reporting"
    columns:
      - name: src_claim_id
        description: "Source claim ID"
        tests:
          - not_null
          - unique
      - name: risk_factor_id
        description: "Risk factor public ID"
      - name: src_risk_factor_id
        description: "Source risk factor ID"
      - name: new_risk_factor_ind
        description: "New risk factor indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: retired_ind
        description: "Retired indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: risk_factor_cd
        description: "Risk factor code"
      - name: risk_factor_desc
        description: "Risk factor description"
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

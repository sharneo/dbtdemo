      description: "Internal technical GW field to manage object versions."
   -  name: isrtwiflag
      description: "Indicator if the term is elegible for Return to work incentives"
   -  name: islegacy_icare
      description: "If the source of policy record is Legacy or not. It indicates whether this is a term of a legacy policy being migrated, such that a legacy policy can have a mixture of these flags across the terms migrated vs. those created new in Guidewire."
   -  name: updateuserid
      description: "User ID of the user that updated this record. Foreign key to PC_USER."

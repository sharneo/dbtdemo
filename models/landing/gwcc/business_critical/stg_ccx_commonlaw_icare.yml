version: 2
models:
-  name: stg_ccx_commonlaw_icare
   description: "Incremental staging model for Guidewire Claim Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: ctmresolutiontype
      description: ""
   -  name: section74noticedate_icare
      description: "Date the dispute was advised/sent to plaintiff/applicant"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_ccx_commonlaw_icare_publicid_not_null
            config:
               severity: warn
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_ccx_commonlaw_icare_createtime_not_null
            config:
               severity: warn
   -  name: dateparticrece_icare
      description: "If WPI has not been determined we seek relevant particulars which may include an IME assessment.  This is the date all reports are received."
   -  name: nocdatereceived_icare
      description: "s281/282 Notice received date"
   -  name: dateparticrequ_icare
      description: "Date we have requested additional information"
   -  name: outcome_icare
      description: "Outcome of common law claim"
   -  name: initialdatereceived_icare
      description: "Value selected on new common law page"
   -  name: typeofdispute_icare
      description: "Type of dispute"
   -  name: settlementdate_icare
      description: "Settlement Date"
   -  name: initialnoticeofintention_icare
      description: "Value selected on new common law page"
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_ccx_commonlaw_icare_updatetime_not_null
            config:
               severity: warn
   -  name: claimdisputed_icare
      description: "If claim is in dispute"
   -  name: noticeofintention_icare
      description: "Notice of intent to claim (not s281/282 notice) received"
   -  name: mediationcertificate_icare
      description: "Terms and offers"
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_ccx_commonlaw_icare_id_not_null
            config:
               severity: warn
   -  name: namereference_icare
      description: "Reference for this action"
   -  name: reasonreopened_icare
      description: "Reason Common Law Reopened "
   -  name: prefilingdefencedate_icare
      description: "Date we supply our response to the Statement"
   -  name: defectivenoticesentdate_icare
      description: "Date we respond to request changes made to the Statement submitted"
   -  name: litigationstarted
      description: "Flag if litigation was started"
   -  name: mediationdate_icare
      description: "Date and time of Mediation"
   -  name: createuserid
      description: "User who created the object"
   -  name: noticeofclaimnotreceived_icare
      description: "Notice of Claim was not received and we receive late notice to immediately start Pre Filing"
   -  name: recoverypotential_icare
      description: "Whether recovery/subrogation potential has been identified "
   -  name: settlement_icare
      description: "Common law settlement method"
   -  name: dateofinstruction_icare
      description: "Defense Appointed Date"
   -  name: validationlevel_icare
      description: "Current step of common law"
   -  name: prefilingdatereceived_icare
      description: "Pre Filing Statement Date Received"
   -  name: statementofclaimdaterec_icare
      description: "Date statement is received, and is the trigger to Litigation processing"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: noticeofclaim_icare
      description: "s281/282 Notice received"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_ccx_commonlaw_icare_retired_not_null
            config:
               severity: warn
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: settlementcost_icare
      description: "Settlement Cost"
   -  name: initialnoticenotrec_icare
      description: "Value selected on new common law page"
   -  name: ourlegalcosts_icare
      description: "Our Legal Costs"
   -  name: mattertype_icare
      description: "Type of common law matter"
   -  name: subtype
      description: "Identifies a particular subtype within a supertype table; each subtype of a supertype has its own unique subtype value"
      tests:
      -  not_null:
            name: gwcc_ccx_commonlaw_icare_subtype_not_null
            config:
               severity: warn
   -  name: trialdate_icare
      description: "Date of trial"
   -  name: resultofmediation_icare
      description: ""

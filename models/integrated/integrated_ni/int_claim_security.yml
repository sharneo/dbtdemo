version: 2
models:
-  name: int_claim_security
   description: "Integrated claim security model sourced from Guidewire CC. Contains policy and managing entity details for security-related claim reporting. Original SAS source: 62_CLAIM_SECURITY.sas (TBL_NM: MSC_QLK_ASPIRE_CLAIM_SECURITY)"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber) - primary key"
      tests:
      -  unique:
            name: int_claim_security_claim_sk_unique
            config:
               severity: warn
      -  not_null:
            name: int_claim_security_claim_sk_not_null
            config:
               severity: warn
   -  name: source_system
      description: "Source system identifier"
   -  name: src_claim_id
      description: "Source claim ID"
      tests:
      -  not_null:
            name: int_claim_security_src_claim_id_not_null
            config:
               severity: warn
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_claim_security_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_claim_security_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: managing_entity_cd
      description: "Managing entity code"
   -  name: managingentity_name
      description: "Managing entity name"
   -  name: insurernumber
      description: "Insurer number"
   -  name: policynumber
      description: "Policy number"
   -  name: policytype_id
      description: "Policy type ID"
   -  name: policytype_cd
      description: "Policy type code"
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_claim_security_file_ingestion_timestamp_not_null
            config:
               severity: warn

version: 2
models:
-  name: int_certificate_of_capacity
   description: "Integrated certificate of capacity model sourced from Guidewire CC. Captures employment capacity assessments including fitness status, hours worked, and certification dates. Original SAS source: 04_CERTIFICATE_OF_CAPACITY.sas (TBL_NM: MSC_QLK_ASPIRE_CERTIFICATE_OF_CAPACITY)"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber)"
      tests:
      -  not_null:
            name: int_certificate_of_capacity_claim_sk_not_null
            config:
               severity: warn
   -  name: source_system
      description: "Source system identifier"
   -  name: src_claim_id
      description: "Source claim ID - component of composite primary key"
      tests:
      -  not_null:
            name: int_certificate_of_capacity_src_claim_id_not_null
            config:
               severity: warn
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_certificate_of_capacity_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_certificate_of_capacity_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: fitness_cd
      description: "Fitness typecode from certificate of capacity"
   -  name: fitness_desc
      description: "Fitness description"
   -  name: certificate_of_capacity_start_dt
      description: "Certificate of capacity start date"
   -  name: certificate_of_capacity_end_dt
      description: "Certificate of capacity end date"
   -  name: certificate_of_capacity_hours_worked_per_week
      description: "Total hours per week from certificate of capacity"
   -  name: src_create_dttm
      description: "Source system creation timestamp"
      tests:
      -  not_null:
            name: int_certificate_of_capacity_src_create_dttm_not_null
            config:
               severity: warn
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_certificate_of_capacity_file_ingestion_timestamp_not_null
            config:
               severity: warn
   -  name: latest_certificate_of_capacity_record_rank
      description: "Row rank for latest certificate of capacity record - component of composite primary key"
      tests:
      -  not_null:
            name: int_certificate_of_capacity_latest_rank_not_null
            config:
               severity: warn
   -  name: retired_ind
      description: "Retired indicator (Y/N)"
   -  name: certificate_of_capacity_status
      description: "Certificate of capacity status"

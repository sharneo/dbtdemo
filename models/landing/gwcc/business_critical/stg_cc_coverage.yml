version: 2
models:
-  name: stg_cc_coverage
   description: "Incremental staging model for Guidewire Claim Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: notes
      description: "Additional notes on this coverage."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_coverage_publicid_not_null
            config:
               severity: warn
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_coverage_createtime_not_null
            config:
               severity: warn
   -  name: policyid
      description: "Policy to which the coverage belongs."
      tests:
      -  not_null:
            name: gwcc_cc_coverage_policyid_not_null
            config:
               severity: warn
   -  name: replaceagglimit
      description: "The dollar limit for all PIP Lost Wage and Replacement Services coverage."
   -  name: state
      description: "The state in which this coverage is applicable, if state-specific."
   -  name: currency
      description: "The currency of the coverage. Once set, this value can be updated only when CoverageMethods.allowCurrencyChange() returns true."
      tests:
      -  not_null:
            name: gwcc_cc_coverage_currency_not_null
            config:
               severity: warn
   -  name: exposurelimit
      description: "Dollar limit per exposure."
   -  name: effectivedate
      description: "Date on which the coverage is effective."
   -  name: deductible
      description: "Deductible for this coverage."
   -  name: coveragebasis
      description: "Coverage basis."
   -  name: claimagglimit
      description: "The per incident dollar limit for all PIP coverage."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_coverage_updatetime_not_null
            config:
               severity: warn
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_coverage_id_not_null
            config:
               severity: warn
   -  name: expirationdate
      description: "Date on which the coverage is expired."
   -  name: createuserid
      description: "User who created the object"
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: incidentlimit
      description: "Dollar limit per incident."
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_coverage_retired_not_null
            config:
               severity: warn
   -  name: coinsurance
      description: "Co-insurance percentage."
   -  name: riskunitid
      description: "RiskUnit associated with the coverage."
   -  name: personagglimit
      description: "The per person dollar limit for all PIP coverage."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: limitsindicator
      description: "Whether a coverage type can be combined."
   -  name: nonmedagglimit
      description: "The dollar limit for all PIP Non-Medical coverage."
   -  name: type
      description: "Type of coverage."
      tests:
      -  not_null:
            name: gwcc_cc_coverage_type_not_null
            config:
               severity: warn
   -  name: subtype
      description: "Identifies a particular subtype within a supertype table; each subtype of a supertype has its own unique subtype value"
      tests:
      -  not_null:
            name: gwcc_cc_coverage_subtype_not_null
            config:
               severity: warn
   -  name: policysystemid
      description: "Identifier for the coverage in an external policy system"
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

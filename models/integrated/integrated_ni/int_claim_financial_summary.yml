version: 2
models:
-  name: int_claim_financial_summary
   description: "Integrated claim financial summary model sourced from Guidewire CC. Contains exposure-level financial data including reserves, payments, recoveries, and benefit accruals. Original SAS source: 07_CLAIM_FINANCIAL_SUMMARY.sas (TBL_NM: MSC_QLK_ASPIRE_CLAIM_FINANCIAL_SUMMARY)"
   columns:
   -  name: claim_sk
      description: "Surrogate key for the claim (source_system + claimnumber)"
      tests:
      -  not_null:
            name: int_claim_financial_summary_claim_sk_not_null
            config:
               severity: warn
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_claim_financial_summary_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_claim_financial_summary_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: src_claim_id
      description: "Source claim ID"
      tests:
      -  not_null:
            name: int_claim_financial_summary_src_claim_id_not_null
            config:
               severity: warn
   -  name: src_exp_rpt_id
      description: "Source exposure report ID - primary key"
      tests:
      -  unique:
            name: int_claim_financial_summary_src_exp_rpt_id_unique
            config:
               severity: warn
      -  not_null:
            name: int_claim_financial_summary_src_exp_rpt_id_not_null
            config:
               severity: warn
   -  name: src_exp_id
      description: "Source exposure ID"
      tests:
      -  not_null:
            name: int_claim_financial_summary_src_exp_id_not_null
            config:
               severity: warn
   -  name: exposure_type_cd
      description: "Exposure type code"
   -  name: exposure_type_desc
      description: "Exposure type description"
   -  name: available_reserves
      description: "Available reserves amount"
   -  name: open_reserves
      description: "Open reserves amount"
   -  name: open_recovery_reserves
      description: "Open recovery reserves amount"
   -  name: remaining_reserves
      description: "Remaining reserves amount"
   -  name: future_payments
      description: "Future payments amount"
   -  name: total_payments_made
      description: "Total payments made amount"
   -  name: total_recoveries
      description: "Total recoveries amount"
   -  name: summary_eff_dttm
      description: "Summary effective datetime"
   -  name: worker_payer
      description: "Worker payer name"
   -  name: total_weekly_benefit_paid_wk_count
      description: "Total weekly benefit paid week count"
   -  name: exp_status_cd
      description: "Exposure status code"
   -  name: exp_status_desc
      description: "Exposure status description"
   -  name: exp_close_dt
      description: "Exposure close date"
   -  name: exp_closed_outcome
      description: "Exposure closed outcome"
   -  name: assigned_user_id
      description: "Assigned user ID"
   -  name: assigned_team_id
      description: "Assigned team ID"
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_claim_financial_summary_file_ingestion_timestamp_not_null
            config:
               severity: warn

version: 2

snapshots:
  - name: ccenter_security_snapshot
    description: |
      SCD Type 2 history of Cost Center Security assignments.
      Grain: one row per version of each cost center security access mapping.
      Maps network identifiers to cost center numbers for access control.
    columns:
      - name: ccenter_security_sk
        description: Surrogate key for this cost center security record, generated from [network_id, cc_number]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: network_id
        description: Network identifier for the user or group with cost center access.

      - name: cc_number
        description: Cost Center Number that the network identifier has access to.

      - name: cc_name
        description: Cost Center Name. Descriptive name of the associated cost center.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

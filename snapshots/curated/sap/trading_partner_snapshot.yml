version: 2

snapshots:
  - name: trading_partner_snapshot
    description: |
      SCD Type 2 history of SAP Trading Partners.
      Grain: one row per version of each trading partner.
      Identifies external or intercompany trading entities used in consolidated financial reporting.
    columns:
      - name: trading_partner_sk
        description: Surrogate key for this trading partner record, generated from [rcomp]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: rcomp
        description: Company ID (SAP RCOMP). Identifies a trading partner company for intercompany transactions.

      - name: name1
        description: Trading Partner Name. Name of the trading partner company.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

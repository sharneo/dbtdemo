snapshots:
  - name: bctl_userattributetype_snapshot
    relation: ref('stg_bctl_userattributetype')
    config:
      schema: GWBC
      unique_key: userattributetype_sk
      alias: bctl_userattributetype
      strategy: check
      check_cols: ["hash_key"]
      hard_deletes: new_record
      tags: ["curated","gwbc","billing_centre", "non_business_critical"]
      snapshot_meta_column_names:
        dbt_valid_from: valid_from
        dbt_valid_to: valid_to
        dbt_scd_id: scd_id
        dbt_updated_at: modified_date
        dbt_is_deleted: is_deleted

      dbt_valid_to_current: "to_date('9999-12-31')"

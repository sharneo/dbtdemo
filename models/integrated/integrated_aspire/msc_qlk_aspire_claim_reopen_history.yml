version: 2

models:
  - name: msc_qlk_aspire_claim_reopen_history
    description: >
      Integrated claim reopen history model sourced from GuidewireCC.
      Contains reopen events for claims with history type 'reopened'.
      Original SAS source: 55_CLAIM_REOPEN_HISTORY.sas (TBL_NM: MSC_QLK_ASPIRE_CLAIM_REOPEN_HISTORY)
    columns:
      - name: claim_sk
        description: Surrogate key for the claim (MD5 hash of source_system + claim number)
      - name: source_system
        description: Source system identifier from the driving CTE
      - name: managing_entity_id
        description: Managing entity ID foreign key from cc_claim
      - name: managing_entity_sk
        description: Surrogate key for the managing entity (MD5 hash of source_system + publicid)
      - name: managing_entity_cd
        description: Managing entity code from ccx_managingentity_icare
      - name: claim_nbr
        description: Claim number from GuidewireCC
      - name: src_claim_id
        description: Source claim ID from CC_CLAIM
      - name: src_claim_hist_id
        description: Source claim history ID from CC_HISTORY
      - name: claim_hist_type
        description: History type name from cctl_historytype
      - name: claim_hist_desc
        description: History event description
      - name: reopened_dt
        description: Date the claim was reopened
      - name: reopened_dttm
        description: Datetime the claim was reopened
      - name: reopened_mth
        description: Month number of the reopen event
      - name: reopened_yr
        description: Year of the reopen event
      - name: reopened_wk_number
        description: Week number of the reopen event
      - name: reopened_unique_yr_ind
        description: Indicator for unique reopen per year (1=latest per claim+year)
      - name: reopened_unique_monthyr_ind
        description: Indicator for unique reopen per month+year (1=latest per claim+month+year)
      - name: reopened_unique_weekyr_ind
        description: Indicator for unique reopen per week+year (1=latest per claim+week+year)
      - name: file_ingestion_timestamp
        description: Timestamp of file ingestion, used as incremental filter

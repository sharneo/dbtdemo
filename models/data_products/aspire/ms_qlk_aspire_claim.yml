version: 2

models:
  - name: ms_qlk_aspire_claim
    description: "Core claim dimension with comprehensive claim attributes, policy details, and worker information"
    columns:
      - name: claim_sk
        description: "Surrogate key for the claim"
        tests:
          - not_null
          - unique
      - name: source_system
        description: "Source system code"
        tests:
          - not_null
          - accepted_values:
              values: ['GWCC']
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
          - unique
      - name: src_claim_id
        description: "Source system claim ID"
        tests:
          - not_null
      - name: common_law_ind
        description: "Indicates if common law liability applies"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: incident_only_ind
        description: "Indicates if claim is incident only"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: lost_time_ind
        description: "Indicates if claim involves lost time"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: medical_attention_ind
        description: "Indicates if medical attention was required"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: verified_policy_ind
        description: "Indicates if policy has been verified"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: claim_migrated_ind
        description: "Indicates if claim was migrated from legacy system"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: covid_ind
        description: "Indicates if claim is COVID-related"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: claim_reimbursement_sched_ind
        description: "Indicates if wage reimbursement schedule agreement exists"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: conflict_of_interest_ind
        description: "Indicates if conflict of interest exists"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

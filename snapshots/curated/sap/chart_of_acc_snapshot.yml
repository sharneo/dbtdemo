version: 2

snapshots:
  - name: chart_of_acc_snapshot
    description: |
      SCD Type 2 history of SAP Chart of Accounts / G/L Account master data (SKA1).
      Grain: one row per version of each G/L account within a chart of accounts.
      Defines the chart of accounts structure including account type, grouping, and control indicators.
    columns:
      - name: chart_of_acc_sk
        description: Surrogate key for this G/L account record, generated from [ktopl, saknr]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: ktopl
        description: Chart of Accounts (SAP KTOPL). Identifies the chart of accounts grouping.

      - name: saknr
        description: G/L Account Number (SAP SAKNR). Alphanumeric identifier for the G/L account.

      - name: xbilk
        description: Balance Sheet Account Indicator. 'X' = Balance Sheet account, blank = P&L account.

      - name: sakan
        description: G/L Account Type (SAP SAKAN). Account type classification (asset, liability, equity, revenue, expense).

      - name: bilkt
        description: Group Account Number (SAP BILKT). Higher-level grouping account for aggregated reporting.

      - name: erdat
        description: Created On (SAP ERDAT). Date when the G/L account was created.

      - name: ernam
        description: Created By (SAP ERNAM). User who created the G/L account.

      - name: gvtyp
        description: P&L Statement Type (SAP GVTYP). Defines how the account behaves in P&L reporting.

      - name: ktoks
        description: Account Group (SAP KTOKS). Classification group for the G/L account.

      - name: xspea
        description: Posting Without Tax Allowed. 'X' = postings without tax are allowed.

      - name: xspeb
        description: Posting Without Vendor Allowed. 'X' = postings without vendor are allowed (for GR/IR accounts).

      - name: xspep
        description: Posting Without Customer Allowed. 'X' = postings without customer are allowed.

      - name: glaccount_type
        description: G/L Account Type. Identifies the account category (primary cost, revenue, secondary cost, etc.).

      - name: txt20
        description: Short Text (SAP TXT20). Short description of the G/L account (20 characters).

      - name: txt50
        description: Long Text (SAP TXT50). Detailed description of the G/L account (50 characters).

      - name: RECORDTYPE
        description: Record type indicator from the source system.

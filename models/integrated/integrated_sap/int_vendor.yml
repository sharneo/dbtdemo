version: 2

models:
  - name: int_vendor
    description: >
      Incremental model for Vendor reference data sourced from SAP.
      Contains vendor master data including company code, payment methods,
      terms of payment, reconciliation account, and clerk details.
    columns:
      - name: vendor_sk
        description: Surrogate key for the vendor record
      - name: vendor
        description: Vendor number (LIFNR)
      - name: company_code
        description: Company code the vendor belongs to (BUKRS)
      - name: created_on
        description: Date the record was created in SAP (ERDAT)
      - name: sort_key
        description: Sort key for allocation field (ZUAWA)
      - name: reconciliation_acct
        description: Reconciliation account in general ledger (AKONT)
      - name: payment_methods
        description: Payment methods available for this vendor (ZWELS)
      - name: terms_of_payment
        description: Terms of payment key (ZTERM)
      - name: clerk_at_vendor
        description: Clerk at vendor (ZSABE)
      - name: planning_group
        description: Planning group (FDGRV)
      - name: clrk_internet_add
        description: Clerk internet address (INTAD)
      - name: metadata_file_name
        description: Source metadata file name
      - name: file_ingestion_timestamp
        description: Timestamp of file ingestion, used as incremental filter
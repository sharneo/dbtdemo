version: 2

models:
  - name: msc_qlk_aspire_claim_document_invoice
    description: >
      Integrated document invoices model sourced from GuidewireCC.
      Contains inbound documents of type 'Invoice' linked to claims.
      Original SAS source: 56_DOCUMENT_INVOICES.sas (TBL_NM: MSC_QLK_Aspire_claim_document_invoice)
    columns:
      - name: claim_sk
        description: Surrogate key for the claim (MD5 hash of source_system + claim number)
      - name: source_system
        description: Source system identifier from the driving CTE
      - name: claim_nbr
        description: Claim number from GuidewireCC
      - name: src_claim_id
        description: Source claim ID from CC_CLAIM
      - name: doc_uid
        description: Document unique identifier from cc_document
      - name: document_status
        description: Document status name from cctl_documentstatustype
      - name: document_sent_dttm
        description: Date/time the document was sent or received
      - name: file_name
        description: Document file name
      - name: description
        description: Document description
      - name: document_create_dttm
        description: Document creation datetime
      - name: document_channel
        description: Document channel name from cctl_documentchannel_icare
      - name: document_author
        description: Document author
      - name: file_ingestion_timestamp
        description: Timestamp of file ingestion, used as incremental filter

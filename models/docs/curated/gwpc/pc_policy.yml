version: 2
models:
-  name: pc_policy
   columns:
   -  name: donotdestroy
      description: ""
   -  name: isportalpolicy_icare
      description: "If the source of policy record is Legacy or not"
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
   -  name: priorpremiums
      description: "Premium for terms prior to conversion. GW Out-of-the-box functionality for prior losses and not used by icare as at Nov-17."
   -  name: issuedate
      description: "The date on which this policy was issued by the issuing job."
   -  name: priorpremiums_cur
      description: ""
   -  name: movedpolicysourceaccountid
      description: "Foreign key to PC_ACCOUNT.ID. This account id refers to the old Account ID if the policy was moved from an account. This functionality is not used by icare as at Nov-17."
   -  name: accountid
      description: "Foreign key to PC_ACCOUNT.ID"
   -  name: createtime
      description: "Timestamp when the object was created"
   -  name: losshistorytype
      description: "How the loss history is described for this policy"
   -  name: excludedfromarchive
      description: "Indicate if this entity should be excluded from archiving"
   -  name: archivestate
      description: "The archive state of the graph"
   -  name: archiveschemainfo
      description: "Schema version at which the root was archived or null if it was not archived"
   -  name: archivefailuredetailsid
      description: "Internal technical GW field to manage archiving."
   -  name: packagerisk
      description: "Package Risk Type"
   -  name: numpriorlosses
      description: "The number of losses. Only applicable for a loss history type of attached."
   -  name: updatetime
      description: "Timestamp when the object was last updated"
   -  name: primarylanguage
      description: "The policys preferred language"
   -  name: donotarchive
      description: "Do not archive any of the terms for this Policy. Terms that are already archived will not be automatically retrieved."
   -  name: id
      description: "Internally managed primary key"
   -  name: primarylocale
      description: "The policys preferred locale"
   -  name: productcode
      description: "The Product defining what kind of Policy this is"
   -  name: excludereason
      description: "Reason for excluding or skipping the entity from archiving. If the ExcludeFromArchive bit is set, this gives the reason for excluding. Else, if this is not null, it is the reason for skipping."
   -  name: groupnumberfromportal
      description: "icare specific field to capture Portal Group number details"
   -  name: createuserid
      description: "User ID of the user that created this record. Foreign key to PC_USER."
   -  name: archivefailureid
      description: "Internal technical GW field to manage archiving."
   -  name: crnnumber_icare
      description: "icare specific field to hold Policy CRN number details"
   -  name: originaleffectivedate
      description: "The date on which this policy was originally issued or bound."
   -  name: beanversion
      description: "Internal technical GW field to manage object versions."
   -  name: archivepartition
      description: "Unique number to partition the data so that the multiple workers can work independently"
   -  name: retired
      description: "Indicator in GW signifying the record has been soft deleted."
   -  name: updateuserid
      description: "User ID of the user that updated this record. Foreign key to PC_USER."
   -  name: priortotalincurred
      description: "Related to loss history. GW Out-of-the-box functionality for prior losses and not used by icare as at Nov-17."
   -  name: archivedate
      description: "When archiving was attempted on the root. Null if we never attempted to archive it."
   -  name: priortotalincurred_cur
      description: ""
   -  name: producercodeofserviceid
      description: "FK to the PC_PRODUCERCODE table which stores who the Intermediary of Service for this policy is i.e. icare (employer direct) or via broker. This is the same as the PC_EFFECTIVEDATEDFIELDS.ProducerCodeID"
   -  name: newproducercode_ext
      description: "Interal technical GW field used to enact bulk changes of changing the Producer of the policies e.g. moving all Policy administration from icare to EML. The master data for the Producer of the policy will be sourced from persistent GW tables like pc_producercode once the change takes effect."
   -  name: newclaimschemeagent_icare
      description: "The Claims Scheme agent allocated to manage Claims lodged against the policy. This is replaced with PC_POLICYPERIOD.ClaimsMgr_SchemeAgent_icare. No longer used at the PC_POLICY level"

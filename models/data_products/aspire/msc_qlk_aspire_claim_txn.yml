version: 2

models:
  - name: msc_qlk_aspire_claim_txn
    description: "Claim transactions for ASPIRE claims reporting"
    columns:
      - name: claim_txn_sk
        description: "Surrogate key for claim transaction"
        tests:
          - not_null
          - unique
      - name: claim_txn_id
        description: "Claim transaction public ID"
      - name: src_claim_txn_id
        description: "Source claim transaction ID"
      - name: src_claim_txn_set_id
        description: "Source claim transaction set ID"
      - name: source_system
        description: "Source system code"
        tests:
          - not_null
          - accepted_values:
              values: ['GWCC']
      - name: src_claim_payment_id
        description: "Source claim payment ID"
      - name: claim_sk
        description: "Surrogate key for claim"
        tests:
          - relationships:
              arguments:
                to: ref('msc_qlk_aspire_claim')
                field: claim_sk
      - name: claim_nbr
        description: "Claim number"
        tests:
          - not_null
      - name: src_claim_id
        description: "Source claim ID"
        tests:
          - not_null
      - name: adj_payment_ind
        description: "Adjustment payment indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: migrated_txn_ind
        description: "Migrated transaction indicator"
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: extract_date
        description: "Extract date"
        tests:
          - not_null
      - name: file_ingestion_timestamp
        description: "Timestamp of file ingestion for incremental processing"
        tests:
          - not_null

version: 2

snapshots:
  - name: doc_types_snapshot
    description: |
      SCD Type 2 history of SAP Document Types (T003).
      Grain: one row per version of each document type.
      Classifies accounting documents by business purpose (e.g., SA = G/L Account Document, KR = Vendor Invoice).
    columns:
      - name: doc_types_sk
        description: Surrogate key for this document type record, generated from [blart]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: blart
        description: Document Type (SAP BLART). Two-character code that categorizes accounting documents (e.g., KR = Vendor, SA = G/L, DR = Customer).

      - name: spras
        description: Language Key (SAP SPRAS). Language used for the document type description text.

      - name: ltext
        description: Document Type Description. Long text name of the document type (e.g., "Vendor Invoice", "G/L Account Document").

      - name: RECORDTYPE
        description: Record type indicator from the source system.

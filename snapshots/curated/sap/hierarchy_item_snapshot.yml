version: 2

snapshots:
  - name: hierarchy_item_snapshot
    description: |
      SCD Type 2 history of SAP Hierarchy/Set Items (SETNODE).
      Grain: one row per version of each hierarchy item node.
      Stores the individual node/item definitions within a set hierarchy, including selection criteria.
    columns:
      - name: hierarchy_item_sk
        description: Surrogate key for this hierarchy item record, generated from [setclass, subclass, setname, lineid]. Used as the unique_key for SCD Type 2 change tracking.

      - name: dbt_valid_from
        description: Timestamp when this record version became valid.

      - name: dbt_valid_to
        description: Timestamp when this record version was superseded. NULL = currently active.

      - name: dbt_updated_at
        description: Timestamp of the last snapshot run that detected a change.

      - name: dbt_scd_id
        description: Unique identifier for each SCD Type 2 version.

      - name: setclass
        description: Set Class (SAP SETCLASS). Categorizes the set type.

      - name: subclass
        description: Subclass of the set within the set class.

      - name: setname
        description: Set Name. Unique name identifying the parent hierarchy or set.

      - name: lineid
        description: Line Identifier. Unique identifier for this item within the set.

      - name: valsign
        description: Sign for selection values (SAP VALSIGN). 'I' = Include, 'E' = Exclude.

      - name: valoption
        description: Selection option (SAP VALOPTION). Comparison operator (EQ, BT, CP, etc.).

      - name: valfrom
        description: Selection value from (SAP VALFROM). Lower bound of the selection range.

      - name: valto
        description: Selection value to (SAP VALTO). Upper bound of the selection range.

      - name: seqnr
        description: Sequence Number. Ordering of selection criteria within the line item.

      - name: RECORDTYPE
        description: Record type indicator from the source system.

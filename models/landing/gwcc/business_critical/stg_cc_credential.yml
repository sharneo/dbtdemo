version: 2
models:
-  name: stg_cc_credential
   description: "Incremental staging model for Guidewire Claim Center data. Loads from AVRO and PARQUET files with CDC support via gwcbi_* fields."
   columns:
   -  name: loadcommandid
      description: "LoadCommand for load where row was created. If not null this object was loaded via the loader."
   -  name: obfuscatedinternal
      description: "Flag to let us know if the bean has been obfuscated."
      tests:
      -  not_null:
            name: gwcc_cc_credential_obfuscatedinternal_not_null
            config:
               severity: warn
   -  name: createuserid
      description: "User who created the object"
   -  name: failedattempts
      description: "The number of consecutive failed login attempts, or 0 if the last login attempt was successful."
   -  name: publicid
      description: "ID or primary key of the row in the external system to which this row is mapped"
      tests:
      -  not_null:
            name: gwcc_cc_credential_publicid_not_null
            config:
               severity: warn
   -  name: active
      description: "Whether this credential is active. Inactive credentials are not allowed to log in."
      tests:
      -  not_null:
            name: gwcc_cc_credential_active_not_null
            config:
               severity: warn
   -  name: beanversion
      description: "Auto-incremented object version"
   -  name: retired
      description: "Whether the entity is still in use. A value of 0 means that the entity is not retired. If the entity is retired from active use, this field has a non-zero value equal to the entitys ID. Once an entity is retired, it should not be unretired."
      tests:
      -  not_null:
            name: gwcc_cc_credential_retired_not_null
            config:
               severity: warn
   -  name: createtime
      description: "Timestamp when the object was created"
      tests:
      -  not_null:
            name: gwcc_cc_credential_createtime_not_null
            config:
               severity: warn
   -  name: failedtime
      description: "The time the last failed login attempt was made, or null if the last login attempt was successful."
   -  name: updateuserid
      description: "User who last updated the object"
   -  name: usernamedenorm
      description: "denorm field for User login name."
      tests:
      -  not_null:
            name: gwcc_cc_credential_usernamedenorm_not_null
            config:
               severity: warn
   -  name: username
      description: "User login name."
      tests:
      -  not_null:
            name: gwcc_cc_credential_username_not_null
            config:
               severity: warn
   -  name: updatetime
      description: "Timestamp when the object was last updated"
      tests:
      -  not_null:
            name: gwcc_cc_credential_updatetime_not_null
            config:
               severity: warn
   -  name: lockdate
      description: "The time at which this credential was locked, or null if the credential is not locked.  A user cannot log in if their credential was locked within the lockout interval, which is paramaterizeable."
   -  name: id
      description: "Internally managed primary key"
      tests:
      -  not_null:
            name: gwcc_cc_credential_id_not_null
            config:
               severity: warn
   -  name: password
      description: "User password."
      tests:
      -  not_null:
            name: gwcc_cc_credential_password_not_null
            config:
               severity: warn
   -  name: gwcbi_connector_ts_ms
      description: ""
   -  name: gwcbi_lsn
      description: ""
   -  name: gwcbi_operation
      description: ""
   -  name: gwcbi_payload_ts_ms
      description: ""
   -  name: gwcbi_seqval
      description: ""
   -  name: gwcbi_seqval_hex
      description: ""
   -  name: gwcbi_tx_id
      description: ""
   -  name: metadata_file_name
      description: ""
   -  name: file_ingestion_timestamp
      description: ""
   -  name: file_type
      description: ""
   -  name: hash_key
      description: ""

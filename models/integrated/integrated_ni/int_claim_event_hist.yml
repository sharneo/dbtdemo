version: 2
models:
-  name: int_claim_event_hist
   description: "Integrated claim event history model sourced from Guidewire CC. Tracks matter events with event types and results for litigation matters. Original SAS source: L04_CLAIM_EVENT_HIST.sas (TBL_NM: MSC_QLK_ASPIRE_CLAIM_EVENT_HIST)"
   columns:
   -  name: claim_event_hist_sk
      description: "Surrogate key for claim event history (source_system + claimnumber + matter_event_id) - primary key"
      tests:
      -  unique:
            name: int_claim_event_hist_sk_unique
            config:
               severity: warn
      -  not_null:
            name: int_claim_event_hist_sk_not_null
            config:
               severity: warn
   -  name: claim_sk
      description: "Surrogate key for the claim"
      tests:
      -  not_null:
            name: int_claim_event_hist_claim_sk_not_null
            config:
               severity: warn
   -  name: src_system_cd
      description: "Source system code"
   -  name: claim_nbr
      description: "Claim number from Guidewire CC"
      tests:
      -  not_null:
            name: int_claim_event_hist_claim_nbr_not_null
            config:
               severity: warn
      -  relationships:
            name: int_claim_event_hist_claim_nbr_fk
            arguments:
               to: ref('v_cc_claim_current')
               field: claimnumber
            config:
               severity: warn
   -  name: src_claim_id
      description: "Source claim ID"
      tests:
      -  not_null:
            name: int_claim_event_hist_src_claim_id_not_null
            config:
               severity: warn
   -  name: matternumber
      description: "Matter/case number"
   -  name: event_type_cd
      description: "Event type code"
   -  name: event_type_desc
      description: "Event type description"
   -  name: event_date
      description: "Event date"
   -  name: event_result_cd
      description: "Event result code"
   -  name: event_result_desc
      description: "Event result description"
   -  name: file_ingestion_timestamp
      description: "Timestamp of file ingestion, used as incremental filter"
      tests:
      -  not_null:
            name: int_claim_event_hist_file_ingestion_timestamp_not_null
            config:
               severity: warn
